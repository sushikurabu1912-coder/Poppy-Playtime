<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Spatial Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; text-shadow: 2px 2px 5px #000; pointer-events: none;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
            border-left: 5px solid #f00;
        }
        .status { font-size: 1.1em; margin-bottom: 5px; font-weight: bold; }
        #battery-bar { width: 100px; height: 10px; background: #444; display: inline-block; }
        #battery-fill { height: 100%; background: #0f0; width: 100%; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="status">ENERGY</div>
        <div id="battery-bar"><div id="battery-fill"></div></div>
        <div id="msg" style="margin-top:10px; font-size: 0.8em; color: #ccc;">
            [WASD] Walk | [Arrows/IJKL] Look<br>
            [Space] Flashlight ON/OFF
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        scene.fog = new THREE.Fog(0x222222, 5, 45);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 影を有効化
        document.body.appendChild(renderer.domElement);

        // --- 照明 ---
        const ambient = new THREE.AmbientLight(0x404040, 1.5); // 全体を底上げ
        scene.add(ambient);

        const flashlight = new THREE.SpotLight(0xffffff, 20, 40, Math.PI / 5, 0.5);
        flashlight.castShadow = true;
        flashlight.shadow.mapSize.width = 1024;
        flashlight.shadow.mapSize.height = 1024;
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- 地面 (グリッド付き) ---
        // グリッドヘルパーを重ねることで立体的な距離感を出す
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
        grid.position.y = 0.01;
        scene.add(grid);

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true; // 影を受ける
        scene.add(floor);

        // --- 立体的な壁の配置 ---
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x777777 });
        
        function createWall(w, h, d, x, z) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, wallMaterial);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // 迷路のように壁をランダム配置
        for(let i=0; i<40; i++) {
            const w = Math.random() > 0.5 ? 4 : 1;
            const d = w === 1 ? 4 : 1;
            createWall(w, 2.5, d, Math.random()*60-30, Math.random()*60-30);
        }

        // --- 敵 (より不気味な形に) ---
        const enemyGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.5), new THREE.MeshStandardMaterial({color: 0xff0000}));
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.1), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff0000}));
        eye.position.set(0, 0.7, -0.3);
        enemyGroup.add(body, eye);
        enemyGroup.position.set(10, 0, -15);
        scene.add(enemyGroup);

        // --- 入力とループ ---
        const keys = {};
        let battery = 100;
        let lightOn = true;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'Space') lightOn = !lightOn;
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            // 移動と回転
            if(keys['KeyW']) camera.translateZ(-0.12);
            if(keys['KeyS']) camera.translateZ(0.12);
            if(keys['KeyA']) camera.translateX(-0.12);
            if(keys['KeyD']) camera.translateX(0.12);
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;
            if(keys['ArrowUp'] || keys['KeyI']) camera.rotation.x += 0.03;
            if(keys['ArrowDown'] || keys['KeyK']) camera.rotation.x -= 0.03;

            camera.position.y = 1.6;
            camera.rotation.x = Math.max(-0.8, Math.min(0.8, camera.rotation.x));

            // ライトとUI
            flashlight.intensity = lightOn && battery > 0 ? 25 : 0;
            if(lightOn && battery > 0) battery -= 0.02;
            document.getElementById('battery-fill').style.width = battery + "%";
            if(battery < 20) document.getElementById('battery-fill').style.background = "#f00";

            // 敵の追尾
            const dist = camera.position.distanceTo(enemyGroup.position);
            if(dist < 25) {
                enemyGroup.lookAt(camera.position.x, 0, camera.position.z);
                enemyGroup.translateZ(0.05);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
