<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Survival Horror - Keyboard Only</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #f00; text-shadow: 2px 2px 2px #000; pointer-events: none;
        }
        .status { font-size: 1.2em; margin-bottom: 5px; }
        #msg { color: #fff; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="status">BATTERY: <span id="battery">100</span>%</div>
        <div class="status">LIGHT: <span id="light-status">ON</span></div>
        <div id="msg">
            [WASD] Move<br>
            [Arrows / IJKL] Look Around<br>
            [Space] Toggle Light (Save energy!)
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- シーン・カメラ設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 1, 18);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 懐中電灯 (SpotLight) ---
        const flashlight = new THREE.SpotLight(0xffffff, 5, 20, Math.PI / 6, 0.3);
        flashlight.position.set(0, 0, 0.1);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        const ambient = new THREE.AmbientLight(0x050505); // ほぼ真っ暗
        scene.add(ambient);

        // --- 地面と廃材（障害物） ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x111111 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for(let i=0; i<60; i++) {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(1, Math.random()*3, 1),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            box.position.set(Math.random()*40-20, 0, Math.random()*40-20);
            scene.add(box);
        }

        // --- 敵 ---
        const enemy = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 2, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x660000 })
        );
        enemy.position.set(5, 1, -10);
        scene.add(enemy);

        // --- キーボード入力管理 ---
        const keys = {};
        let battery = 100;
        let lightOn = true;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            // スペースキーでライト切り替え
            if(e.code === 'Space') {
                lightOn = !lightOn;
                document.getElementById('light-status').innerText = lightOn ? "ON" : "OFF";
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        camera.position.y = 1.6;

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. 移動 (WASD)
            const moveSpeed = 0.08;
            if(keys['KeyW']) camera.translateZ(-moveSpeed);
            if(keys['KeyS']) camera.translateZ(moveSpeed);
            if(keys['KeyA']) camera.translateX(-moveSpeed);
            if(keys['KeyD']) camera.translateX(moveSpeed);

            // 2. 視点回転 (IJKL または 方向キー)
            const rotSpeed = 0.03;
            if(keys['KeyI'] || keys['ArrowUp'])    camera.rotation.x += rotSpeed;
            if(keys['KeyK'] || keys['ArrowDown'])  camera.rotation.x -= rotSpeed;
            if(keys['KeyJ'] || keys['ArrowLeft'])  camera.rotation.y += rotSpeed;
            if(keys['KeyL'] || keys['ArrowRight']) camera.rotation.y -= rotSpeed;
            
            // 回転制限（真上・真下を見すぎないように）
            camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));
            camera.position.y = 1.6; // 高さを固定

            // 3. バッテリーとライトの処理
            if(lightOn && battery > 0) {
                battery -= 0.02; // 点灯中は減る
                flashlight.intensity = 5;
            } else {
                flashlight.intensity = 0; // OFFまたは電池切れ
            }
            document.getElementById('battery').innerText = Math.max(0, Math.floor(battery));

            // 4. 敵の挙動（ライトをつけていると気づかれやすい）
            const dist = camera.position.distanceTo(enemy.position);
            const detectRange = lightOn ? 15 : 5; // ライトONなら遠くから見つかる
            
            if(dist < detectRange) {
                enemy.lookAt(camera.position.x, 1, camera.position.z);
                enemy.translateZ(0.03);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
