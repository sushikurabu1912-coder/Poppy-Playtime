<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Exploration - Brighter Version</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; text-shadow: 2px 2px 2px #000; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
        .status { font-size: 1.2em; margin-bottom: 5px; }
        #msg { color: #aaa; margin-top: 10px; font-size: 0.9em;}
    </style>
</head>
<body>
    <div id="ui">
        <div class="status">BATTERY: <span id="battery">100</span>%</div>
        <div class="status">LIGHT: <span id="light-status">ON</span></div>
        <div id="msg">
            [WASD] Move<br>
            [Arrows / IJKL] Look Around<br>
            [Space] Toggle Flashlight
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- シーン・カメラ設定 ---
        const scene = new THREE.Scene();
        
        // 【変更点1】霧を薄く、遠くへ (黒からグレーへ、範囲を18→40へ)
        scene.fog = new THREE.Fog(0x333333, 10, 40); 
        scene.background = new THREE.Color(0x333333); // 背景色もグレーに

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 懐中電灯 (SpotLight) ---
        const flashlight = new THREE.SpotLight(0xffffff, 10, 30, Math.PI / 6, 0.3); // 光を強く、遠くまで
        flashlight.position.set(0, 0, 0.1);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // 【変更点2】環境光を大幅に強化 (0x050505 -> 0x666666)
        // これにより、ライトがなくても全体が見えるようになります
        const ambient = new THREE.AmbientLight(0x666666); 
        scene.add(ambient);

        // --- 地面と障害物 ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x999999 }) // 地面を明るく
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for(let i=0; i<60; i++) {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(1, Math.random()*3, 1),
                // 【変更点3】障害物の色を明るく (0x333333 -> 0xcccccc)
                new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.5 }) 
            );
            box.position.set(Math.random()*40-20, box.geometry.parameters.height/2, Math.random()*40-20);
            scene.add(box);
        }

        // --- 敵 (見えやすくするために少し明るい赤に) ---
        const enemy = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 2, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff3333 })
        );
        enemy.position.set(5, 1, -15); // 少し遠くに配置
        scene.add(enemy);

        // --- キーボード入力管理 ---
        const keys = {};
        let battery = 100;
        let lightOn = true;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'Space') {
                lightOn = !lightOn;
                document.getElementById('light-status').innerText = lightOn ? "ON" : "OFF";
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        camera.position.y = 1.6;

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. 移動 (WASD)
            const moveSpeed = 0.1; // 少し速く
            if(keys['KeyW']) camera.translateZ(-moveSpeed);
            if(keys['KeyS']) camera.translateZ(moveSpeed);
            if(keys['KeyA']) camera.translateX(-moveSpeed);
            if(keys['KeyD']) camera.translateX(moveSpeed);

            // 2. 視点回転 (IJKL または 方向キー)
            const rotSpeed = 0.03;
            if(keys['KeyI'] || keys['ArrowUp'])    camera.rotation.x += rotSpeed;
            if(keys['KeyK'] || keys['ArrowDown'])  camera.rotation.x -= rotSpeed;
            if(keys['KeyJ'] || keys['ArrowLeft'])  camera.rotation.y += rotSpeed;
            if(keys['KeyL'] || keys['ArrowRight']) camera.rotation.y -= rotSpeed;
            
            camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));
            camera.position.y = 1.6;

            // 3. バッテリーとライトの処理 (減りを遅く)
            if(lightOn && battery > 0) {
                battery -= 0.01; 
                flashlight.intensity = 10;
            } else {
                flashlight.intensity = 0;
            }
            document.getElementById('battery').innerText = Math.max(0, Math.floor(battery));

            // 4. 敵の挙動（明るいので検知範囲を固定）
            const dist = camera.position.distanceTo(enemy.position);
            const detectRange = 20; 
            
            if(dist < detectRange) {
                enemy.lookAt(camera.position.x, 1, camera.position.z);
                enemy.translateZ(0.04); // 少し速く
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
