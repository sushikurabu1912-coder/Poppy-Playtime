<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Horror - Mystery & Stealth</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; text-shadow: 2px 2px 5px #000; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border-left: 5px solid #0f0;
        }
        #center-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffff00; font-size: 1.5em; text-align: center; text-shadow: 2px 2px 5px #000;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .status { font-size: 1.1em; margin-bottom: 5px; }
        #battery-bar { width: 100px; height: 8px; background: #333; display: inline-block; }
        #battery-fill { height: 100%; background: #0f0; width: 100%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="status">OBJECTIVE: <span id="task">発電機を探せ</span></div>
        <div class="status">ENERGY</div>
        <div id="battery-bar"><div id="battery-fill"></div></div>
    </div>
    <div id="center-msg"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- シーン設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 2, 35);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 照明 ---
        const ambient = new THREE.AmbientLight(0x444444);
        scene.add(ambient);

        const flashlight = new THREE.SpotLight(0xffffff, 30, 25, Math.PI / 6, 0.4);
        flashlight.castShadow = true;
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- 地面 ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        scene.add(new THREE.GridHelper(100, 40, 0x333333, 0x222222));

        // --- ギミック：危険エリア（敵が起動する場所） ---
        const dangerZone = new THREE.Mesh(
            new THREE.PlaneGeometry(15, 15),
            new THREE.MeshStandardMaterial({ color: 0xff0000, transparent: true, opacity: 0.2 })
        );
        dangerZone.rotation.x = -Math.PI / 2;
        dangerZone.position.set(20, 0.02, -20);
        scene.add(dangerZone);

        // --- ギミック：謎解きスイッチ（発電機） ---
        const generator = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1.5, 1),
            new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x333300 })
        );
        generator.position.set(-15, 0.75, -15);
        scene.add(generator);

        // --- 壁（迷路） ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const createWall = (w, h, d, x, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, h/2, z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
        };
        createWall(20, 3, 1, 0, -10); // 正面の壁
        createWall(1, 3, 20, -10, -20); // 左の通路

        // --- 敵 ---
        const enemy = new THREE.Group();
        enemy.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), new THREE.MeshStandardMaterial({color: 0xff0000})));
        enemy.position.set(25, 0, -25);
        scene.add(enemy);

        // --- ゲーム状態 ---
        let gameState = {
            hasPower: false,
            inDangerZone: false,
            battery: 100,
            lightOn: true
        };

        const showMsg = (txt) => {
            const el = document.getElementById('center-msg');
            el.innerText = txt;
            el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        };

        // --- 操作 ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'Space') gameState.lightOn = !gameState.lightOn;
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. 移動
            const speed = 0.12;
            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;
            camera.position.y = 1.6;

            // 2. ギミック判定：発電機
            const distToGen = camera.position.distanceTo(generator.position);
            if(!gameState.hasPower && distToGen < 2) {
                gameState.hasPower = true;
                generator.material.emissive.setHex(0x00ff00);
                document.getElementById('task').innerText = "脱出ゲートへ向かえ（ danger zone を横切れ）";
                showMsg("電力が復旧した！");
            }

            // 3. 敵の起動ロジック（エリア判定）
            const distToZone = camera.position.distanceTo(dangerZone.position);
            if(distToZone < 7.5) { // 危険エリア内にいる
                if(!gameState.inDangerZone) {
                    showMsg("背後に気配を感じる...");
                    gameState.inDangerZone = true;
                }
                enemy.lookAt(camera.position.x, 0, camera.position.z);
                enemy.translateZ(0.07); // 追いかけてくる
            } else {
                gameState.inDangerZone = false;
            }

            // 4. バッテリー
            flashlight.intensity = gameState.lightOn && gameState.battery > 0 ? 20 : 0;
            if(gameState.lightOn && gameState.battery > 0) gameState.battery -= 0.02;
            document.getElementById('battery-fill').style.width = gameState.battery + "%";

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
