<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シティトライアル風 2Dオンライン対戦ゲーム</title>
    <!-- P2P通信用のライブラリPeerJSを読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #lobby {
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #007aff;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input, button {
            font-size: 16px;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }
        button {
            background-color: #007aff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            display: none; /* 接続完了まで非表示 */
        }
        canvas {
            display: block;
            background-color: #33a853; 
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #555;
            min-width: 180px;
        }
        .bar-container {
            width: 100%;
            background: #444;
            height: 12px;
            border-radius: 6px;
            margin-top: 4px;
            overflow: hidden;
            border: 1px solid #222;
        }
        .hp-bar { width: 100%; height: 100%; background: #34c759; transition: width 0.1s; }
        .shield-bar { width: 100%; height: 100%; background: #007aff; transition: width 0.1s; }
    </style>
</head>
<body>

<!-- マッチングロビー画面 -->
<div id="lobby">
    <h2>⚔️ シティトライアル オンラインロビー ⚔️</h2>
    <p>あなたの部屋コード: <span id="my-peer-id" style="color:#ffeb3b; font-weight:bold;">接続中...</span></p>
    <hr style="border-color:#444;">
    <p>友達の部屋コードを入力して接続：</p>
    <input type="text" id="join-peer-id" placeholder="相手のコードを入力">
    <button id="connect-btn">入室してバトル開始</button>
    <p id="connection-status" style="color:#aaa; font-size:14px;">サーバーに接続しています...</p>
</div>

<!-- ゲーム画面 -->
<div id="gameContainer">
    <div id="ui-overlay">
        <!-- 自分側のステータス -->
        <div class="hud-panel">
            <span style="color:#ff8da1;">▼ プレイヤー (あなた)</span><br>
            HP
            <div class="bar-container"><div id="my-hp" class="hp-bar"></div></div>
            SHIELD
            <div class="bar-container"><div id="my-shield" class="shield-bar"></div></div>
            <span style="font-size:12px; color:#aaa;">🔴S:<span id="s-p">1</span> 🔵A:<span id="a-p">1</span> 🟢T:<span id="t-p">1</span></span>
        </div>
        <!-- タイムとスキル -->
        <div class="hud-panel" style="text-align: center; min-width: 100px;">
            ⏱️ TIME<br><span id="timer" style="font-size:24px; color:#ffeb3b;">60</span>s
        </div>
        <!-- 相手側のステータス -->
        <div class="hud-panel" style="text-align: right;">
            <span style="color:#ffcc00;">▼ ライバル (通信相手)</span><br>
            HP
            <div class="bar-container"><div id="enemy-hp" class="hp-bar"></div></div>
            SHIELD
            <div class="bar-container"><div id="enemy-shield" class="shield-bar"></div></div>
            <span id="skill-name" style="font-size:12px; color: #ffeb3b;">スキル抽選中</span>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- オンライン通信設定 (PeerJS) ---
let peer = new Peer(); 
let conn = null;
let isHost = false;

// 自分のIDが発行されたとき
peer.on('open', (id) => {
    document.getElementById('my-peer-id').innerText = id;
    document.getElementById('connection-status').innerText = '部屋コードを入力するか、相手の接続を待っています...';
});

// 相手から接続されたとき（ホスト側）
peer.on('connection', (connection) => {
    if (conn) return; // 既に接続されていれば無視
    conn = connection;
    isHost = true;
    setupChat();
});

// 自分から相手に接続するとき（ゲスト側）
document.getElementById('connect-btn').addEventListener('click', () => {
    const targetId = document.getElementById('join-peer-id').value.trim();
    if (targetId && !conn) {
        conn = peer.connect(targetId);
        isHost = false;
        setupChat();
    }
});

// 通信イベントの設定
function setupChat() {
    document.getElementById('connection-status').innerText = '接続中...';
    
    conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        initGame();
    });

    // 相手からデータを受信したとき
    conn.on('data', (data) => {
        if (data.type === 'sync') {
            enemy.x = data.x;
            enemy.y = data.y;
            enemy.angle = data.angle;
            enemy.hp = data.hp;
            enemy.shield = data.shield;
            enemy.isCharging = data.isCharging;
            enemy.charge = data.charge;
            enemy.invincibleTimer = data.invincibleTimer;
        }
        if (data.type === 'shoot') {
            projectiles.push({
                x: data.x, y: data.y, vx: data.vx, vy: data.vy,
                radius: data.radius, color: data.color, life: data.life, isEnemy: true
            });
        }
        if (data.type === 'item_take') {
            // 相手がアイテムを拾ったら消す
            items.splice(data.index, 1);
            spawnItem();
        }
    });
}

// --- ゲームオブジェクト設定 ---
const MAP_SIZE = 2000; 
let timeLeft = 60;

const player = {
    x: 0, y: 0, vx: 0, vy: 0, angle: 0, radius: 18,
    baseSpeed: 5, accelRate: 0.4, friction: 0.94,
    patchSpeed: 0, patchAccel: 0, patchTurn: 0,
    charge: 0, maxCharge: 100, isCharging: false, dashTimer: 0,
    hp: 100, maxHp: 100, shield: 100, maxShield: 100, // HP・シールド追加
    skill: null, skillCooldown: 0, invincibleTimer: 0
};

// 通信相手のデータ
const enemy = {
    x: 0, y: 0, angle: 0, radius: 18,
    hp: 100, shield: 100, isCharging: false, charge: 0, invincibleTimer: 0
};

const SKILLS = [
    { id: 'plasma', name: 'プラズマウェーブ', color: '#00ffff' },
    { id: 'freeze', name: 'フリーズブリザード', color: '#a3e5ff' },
    { id: 'wheel', name: 'ホイールダッシュ', color: '#ff5722' }
];

const items = [];
const buildings = [];
const projectiles = [];
const particles = [];
const keys = { w: false, a: false, s: false, d: false, Space: false, f: false };

// 固定シード風に障害物を配置（お互いのマップを同期するため）
function generateMap() {
    buildings.length = 0;
    // 部屋コードの文字列を簡易的なランダムの種にする
    let seed = isHost ? peer.id : conn.peer;
    let num = 0;
    for(let i=0; i<seed.length; i++) num += seed.charCodeAt(i);
    
    for (let i = 0; i < 40; i++) {
        num = (num * 9301 + 49297) % 233280;
        let rand1 = num / 233280;
        num = (num * 9301 + 49297) % 233280;
        let rand2 = num / 233280;
        
        buildings.push({
            x: rand1 * (MAP_SIZE - 200) + 100,
            y: rand2 * (MAP_SIZE - 200) + 100,
            w: 120, h: 120
        });
    }

    // アイテム初期配置
    for (let i = 0; i < 40; i++) spawnItem();
}

function spawnItem() {
    const types = ['speed', 'accel', 'turn'];
    items.push({
        x: Math.random() * (MAP_SIZE - 100) + 50,
        y: Math.random() * (MAP_SIZE - 100) + 50,
        type: types[Math.floor(Math.random() * types.length)],
        radius: 12
    });
}

// --- ゲーム初期化 ---
function initGame() {
    player.skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
    document.getElementById('skill-name').innerText = "あなたのスキル: " + player.skill.name;
    document.getElementById('skill-name').style.color = player.skill.color;

    // ホストとゲストで初期位置を分ける
    if (isHost) {
        player.x = 300; player.y = 300;
        enemy.x = 1700; enemy.y = 1700;
    } else {
        player.x = 1700; player.y = 1700;
        enemy.x = 300; enemy.y = 300;
    }

    generateMap();
    startTimer();
    requestAnimationFrame(update);
}

function startTimer() {
    const timerInterval = setInterval(() => {
        if (timeLeft > 0 && player.hp > 0 && enemy.hp > 0) {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
        } else {
            clearInterval(timerInterval);
        }
    }, 1000);
}

// --- キーボードイベント ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW') keys.w = true;
    if (e.code === 'KeyA') keys.a = true;
    if (e.code === 'KeyS') keys.s = true;
    if (e.code === 'KeyD') keys.d = true;
    if (e.code === 'Space') keys.Space = true;
    if (e.code === 'KeyF') { if (!keys.f) useSkill(); keys.f = true; }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') keys.w = false;
    if (e.code === 'KeyA') keys.a = false;
    if (e.code === 'KeyS') keys.s = false;
    if (e.code === 'KeyD') keys.d = false;
    if (e.code === 'Space') { keys.Space = false; triggerChargeDash(); }
    if (e.code === 'KeyF') keys.f = false;
});

// --- スキル・ダッシュ発動 ---
function useSkill() {
    if (player.skillCooldown > 0 || timeLeft <= 0 || player.hp <= 0) return;

    let pData = null;
    if (player.skill.id === 'plasma') {
        pData = { x: player.x, y: player.y, vx: Math.cos(player.angle) * 14, vy: Math.sin(player.angle) * 14, radius: 14, color: '#00ffff', life: 40 };
        projectiles.push({...pData, isEnemy: false});
        if(conn) conn.send({type: 'shoot', ...pData});
        player.skillCooldown = 80;
    } 
    else if (player.skill.id === 'freeze') {
        for (let angle = 0; angle < Math.PI * 2; angle += 0.5) {
            pData = { x: player.x, y: player.y, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6, radius: 10, color: '#a3e5ff', life: 25 };
            projectiles.push({...pData, isEnemy: false});
            if(conn) conn.send({type: 'shoot', ...pData});
        }
        player.skillCooldown = 150;
    } 
    else if (player.skill.id === 'wheel') {
        player.invincibleTimer = 150; 
        player.dashTimer = 40; 
        player.vx = Math.cos(player.angle) * 18;
        player.vy = Math.sin(player.angle) * 18;
        player.skillCooldown = 260;
    }
}

function triggerChargeDash() {
    if (player.charge > 10) {
        const dashPower = (player.charge / 100) * (9 + player.patchAccel * 1.5);
        player.vx = Math.cos(player.angle) * dashPower;
        player.vy = Math.sin(player.angle) * dashPower;
        player.dashTimer = 20;
    }
    player.charge = 0;
    player.isCharging = false;
}

// ダメージ処理関数
function damagePlayer(amount) {
    if (player.invincibleTimer > 0) return; // 無敵中はノーダメージ
    
    if (player.shield > 0) {
        player.shield -= amount;
        if (player.shield < 0) {
            player.hp += player.shield; // はみ出た分HPを減らす
            player.shield = 0;
        }
    } else {
        player.hp -= amount;
    }
    player.hp = Math.max(0, player.hp);
}

// --- メインループ ---
function update() {
    if (timeLeft <= 0 || player.hp <= 0 || enemy.hp <= 0) return drawEndScreen();

    if (player.skillCooldown > 0) player.skillCooldown--;
    if (player.invincibleTimer > 0) player.invincibleTimer--;
    if (player.dashTimer > 0) player.dashTimer--;

    // シールドの自然微回復（シティトライアルの仕様風）
    if (player.shield < player.maxShield && !keys.Space) player.shield = Math.min(player.maxShield, player.shield + 0.05);

    let ax = 0, ay = 0;
    const currentAccel = player.accelRate + (player.patchAccel * 0.1);

    if (keys.w) ay -= currentAccel;
    if (keys.s) ay += currentAccel;
    if (keys.a) ax -= currentAccel;
    if (keys.d) ax += currentAccel;

    if (keys.Space) {
        player.isCharging = true; ax = 0; ay = 0;
        let currentSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
        if (currentSpeed < 4.5) player.charge = Math.min(player.maxCharge, player.charge + 2.5);
    }

    if (player.invincibleTimer > 0 && player.skill.id === 'wheel') {
        ax += Math.cos(player.angle) * 1.5; ay += Math.sin(player.angle) * 1.5;
        // ホイール中の体当たり判定（相手をひき逃げ）
        let edx = enemy.x - player.x, edy = enemy.y - player.y;
        if(Math.sqrt(edx*edx + edy*edy) < player.radius + enemy.radius) {
            // 通信を介してダメージは相手側で処理されますが、演出として弾を出す等も可能
        }
    }

    player.vx += ax; player.vy += ay;

    if ((!keys.w && !keys.s && !keys.a && !keys.d) || keys.Space) {
        player.vx *= player.friction; player.vy *= player.friction;
    }

    let currentMaxSpeed = player.baseSpeed + (player.patchSpeed * 1.5);
    if (player.invincibleTimer > 0 && player.skill.id === 'wheel') currentMaxSpeed *= 2.5;

    const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
    if (speed > currentMaxSpeed && player.dashTimer <= 0) {
        player.vx = (player.vx / speed) * currentMaxSpeed; player.vy = (player.vy / speed) * currentMaxSpeed;
    }

    player.x += player.vx; player.y += player.vy;

    // 旋回角度の計算
    if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
        let targetAngle = player.angle;
        if (keys.w || keys.s || keys.a || keys.d) {
            let inputX = 0, inputY = 0;
            if (keys.w) inputY -= 1; if (keys.s) inputY += 1;
            if (keys.a) inputX -= 1; if (keys.d) inputX += 1;
            targetAngle = Math.atan2(inputY, inputX);
        } else { targetAngle = Math.atan2(player.vy, player.vx); }

        const turnSpeed = 0.12 + (player.patchTurn * 0.04);
        let diff = targetAngle - player.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.angle += diff * turnSpeed;
    }

    // 外壁・建造物衝突判定
    player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));
    buildings.forEach(b => {
        if (player.x + player.radius > b.x && player.x - player.radius < b.x + b.w &&
            player.y + player.radius > b.y && player.y - player.radius < b.y + b.h) {
            const fL = player.x - b.x, fR = (b.x + b.w) - player.x, fT = player.y - b.y, fB = (b.y + b.h) - player.y;
            const m = Math.min(fL, fR, fT, fB);
            if (m === fL) { player.x = b.x - player.radius; player.vx *= -0.4; }
            else if (m === fR) { player.x = b.x + b.w + player.radius; player.vx *= -0.4; }
            else if (m === fT) { player.y = b.y - player.radius; player.vy *= -0.4; }
            else if (m === fB) { player.y = b.y + b.h + player.radius; player.vy *= -0.4; }
        }
    });

    // アイテム回収判定
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dx = player.x - item.x, dy = player.y - item.y;
        if (Math.sqrt(dx * dx + dy * dy) < player.radius + item.radius) {
            if (item.type === 'speed') { player.patchSpeed++; document.getElementById('s-p').innerText = player.patchSpeed+1;}
            if (item.type === 'accel') { player.patchAccel++; document.getElementById('a-p').innerText = player.patchAccel+1;}
            if (item.type === 'turn') { player.patchTurn++; document.getElementById('t-p').innerText = player.patchTurn+1;}
            
            // アイテム獲得を通信相手に通知
            if(conn) conn.send({type: 'item_take', index: i});
            items.splice(i, 1);
            spawnItem();
        }
    }

    // 弾の更新と自分への当たり判定
    projectiles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        
        // 相手が撃った弾(isEnemy=true)が自分に当たったか判定
        if (p.isEnemy) {
            let dx = player.x - p.x, dy = player.y - p.y;
            if (Math.sqrt(dx * dx + dy * dy) < player.radius + p.radius) {
                damagePlayer(20); // 弾1発につき20ダメージ
                projectiles.splice(idx, 1);
                return;
            }
        }
        if(p.life <= 0) projectiles.splice(idx, 1);
    });

    // ★ 相手へのデータ送信（リアルタイム同期）
    if (conn && conn.open) {
        conn.send({
            type: 'sync',
            x: player.x, y: player.y, angle: player.angle,
            hp: player.hp, shield: player.shield,
            isCharging: player.isCharging, charge: player.charge,
            invincibleTimer: player.invincibleTimer
        });
    }

    // UIゲージの更新
    document.getElementById('my-hp').style.width = player.hp + '%';
    document.getElementById('my-shield').style.width = player.shield + '%';
    document.getElementById('enemy-hp').style.width = enemy.hp + '%';
    document.getElementById('enemy-shield').style.width = enemy.shield + '%';

    // --- 描画開始 ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // 背景グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for (let x = 0; x <= MAP_SIZE; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke(); }
    for (let y = 0; y <= MAP_SIZE; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke(); }

    // 建物・アイテム・弾
    ctx.fillStyle = '#7a7a7a'; buildings.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
    items.forEach(item => {
        ctx.beginPath(); ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = item.type === 'speed' ? '#ff3b30' : item.type === 'accel' ? '#007aff' : '#34c759'; ctx.fill();
    });
    projectiles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
    });

    // 自分マシンの描画
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    if (player.isCharging) { ctx.beginPath(); ctx.arc(0, 0, player.radius + (player.charge/3), 0, Math.PI*2); ctx.fillStyle = 'rgba(255,235,59,0.3)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fillStyle = '#ff8da1'; ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(5, -6, 8, 12); ctx.restore();

    // 相手マシンの描画
    ctx.save(); ctx.translate(enemy.x, enemy.y); ctx.rotate(enemy.angle);
    if (enemy.isCharging) { ctx.beginPath(); ctx.arc(0, 0, enemy.radius + (enemy.charge/3), 0, Math.PI*2); ctx.fillStyle = 'rgba(30,144,255,0.3)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2); ctx.fillStyle = '#ffcc00'; ctx.fill(); // 相手は黄色
    ctx.fillStyle = '#333'; ctx.fillRect(5, -6, 8, 12); ctx.restore();

    ctx.restore();
    requestAnimationFrame(update);
}

// --- リザルト画面 ---
function drawEndScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    
    let resultText = "試合終了！";
    if (player.hp <= 0) resultText = "❌ あなたの敗北... ❌";
    else if (enemy.hp <= 0) resultText = "👑 あなたの勝利！ 👑";
    else resultText = "⏱️ タイムアップ！ ⏱️";

    ctx.fillText(resultText, canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
    ctx.fillText("ページを再読み込みすると新しく部屋を作成できます。", canvas.width / 2, canvas.height / 2 + 50);
}
</script>

</body>
</html>
