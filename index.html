<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rooftop Horror Prototype</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:22px;
    opacity:0.8;
}

#objective{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,0.5);
    padding:12px 16px;
    border:1px solid rgba(255,255,255,0.2);
    font-size:14px;
    width:300px;
}

#message{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:12px 20px;
    font-size:15px;
    opacity:0;
    transition:0.4s;
}

#stamina{
    position:absolute;
    bottom:20px;
    left:20px;
    width:200px;
    height:12px;
    border:1px solid white;
}

#staminaFill{
    width:100%;
    height:100%;
    background:white;
}

#fade{
    position:fixed;
    inset:0;
    background:black;
    pointer-events:none;
    opacity:0;
    transition:1s;
}
</style>
</head>

<body>

<div id="ui">
    <div id="crosshair">+</div>

    <div id="objective">
        <b>OBJECTIVE</b><br>
        屋上中央電源を復旧する
    </div>

    <div id="message"></div>

    <div id="stamina">
        <div id="staminaFill"></div>
    </div>

    <div id="fade"></div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 60);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

renderer.setClearColor(0x050505);

const controls = new PointerLockControls(camera, document.body);

document.body.addEventListener("click", () => {
    controls.lock();
});

scene.add(controls.getObject());

camera.position.set(0,2,10);

const ambient = new THREE.AmbientLight(0x404040,1.2);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0xffffff,1);
moon.position.set(10,20,10);
moon.castShadow = true;
scene.add(moon);

const floorGeo = new THREE.PlaneGeometry(100,100);
const floorMat = new THREE.MeshStandardMaterial({
    color:0x2b2b2b,
    roughness:1
});

const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

function createWall(x,y,z,w,h,d,color=0x444444){
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({ color })
    );

    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    return mesh;
}

createWall(0,2,-20,40,4,1);
createWall(-20,2,0,1,4,40);
createWall(20,2,0,1,4,40);
createWall(0,2,20,40,4,1);

createWall(-10,2,-5,8,4,8,0x303030);
createWall(10,2,-5,8,4,8,0x303030);
createWall(0,2,8,12,4,6,0x303030);

const carousel = new THREE.Group();

const base = new THREE.Mesh(
    new THREE.CylinderGeometry(5,5,1,32),
    new THREE.MeshStandardMaterial({ color:0x662222 })
);

carousel.add(base);

const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.3,6),
    new THREE.MeshStandardMaterial({ color:0x999999 })
);

pole.position.y = 3;
carousel.add(pole);

for(let i=0;i<6;i++){

    const horse = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,2),
        new THREE.MeshStandardMaterial({ color:0xffffff*Math.random() })
    );

    const angle = (Math.PI*2/6)*i;

    horse.position.set(
        Math.cos(angle)*3,
        2,
        Math.sin(angle)*3
    );

    carousel.add(horse);
}

carousel.position.set(0,0,-8);
scene.add(carousel);

const panda = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshStandardMaterial({ color:0xffffff })
);

body.position.y = 1.2;
panda.add(body);

const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.9,32,32),
    new THREE.MeshStandardMaterial({ color:0xffffff })
);

head.position.y = 3;
panda.add(head);

const eye1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.1),
    new THREE.MeshBasicMaterial({ color:0xff0000 })
);

eye1.position.set(-0.2,3,0.8);

const eye2 = eye1.clone();
eye2.position.x = 0.2;

panda.add(eye1);
panda.add(eye2);

panda.position.set(12,0,-12);
scene.add(panda);

const fuse = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshStandardMaterial({ color:0xffff00, emissive:0x888800 })
);

fuse.position.set(-10,1,-5);
scene.add(fuse);

const breaker = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({ color:0x00ffcc, emissive:0x003333 })
);

breaker.position.set(14,1,10);
scene.add(breaker);

let hasFuse = false;
let powerOn = false;

const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.code]=true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.code]=false;
});

const message = document.getElementById("message");

function showMessage(text){

    message.innerHTML = text;
    message.style.opacity = 1;

    setTimeout(()=>{
        message.style.opacity = 0;
    },3000);
}

showMessage("クリックでゲーム開始");

function distance(a,b){
    return a.position.distanceTo(b.position);
}

let stamina = 100;

function updatePlayer(delta){

    const speed = keys["ShiftLeft"] ? 8 : 4;

    if(keys["ShiftLeft"] && stamina > 0){
        stamina -= 25 * delta;
    }else{
        stamina += 15 * delta;
    }

    stamina = Math.max(0,Math.min(100,stamina));

    document.getElementById("staminaFill").style.width = stamina + "%";

    direction.z = Number(keys["KeyW"]) - Number(keys["KeyS"]);
    direction.x = Number(keys["KeyD"]) - Number(keys["KeyA"]);
    direction.normalize();

    controls.moveRight(direction.x * speed * delta);
    controls.moveForward(direction.z * speed * delta);
}

function interact(){

    const playerPos = controls.getObject().position;

    if(distance({position:playerPos}, fuse) < 2 && !hasFuse){

        hasFuse = true;
        scene.remove(fuse);

        showMessage("ヒューズを入手した");
    }

    if(distance({position:playerPos}, breaker) < 3 && hasFuse && !powerOn){

        powerOn = true;

        showMessage("中央電源を復旧した");

        moon.intensity = 2;

        setTimeout(()=>{
            showMessage("まもなく閉店時間です");
        },3000);

        setTimeout(()=>{
            panda.position.set(0,0,0);
        },5000);
    }
}

document.addEventListener("keydown",(e)=>{
    if(e.code==="KeyE"){
        interact();
    }
});

let pandaTimer = 0;

const clock = new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    updatePlayer(delta);

    carousel.rotation.y += 0.3 * delta;

    panda.lookAt(camera.position);

    pandaTimer += delta;

    if(!powerOn){

        if(pandaTimer > 5){

            pandaTimer = 0;

            panda.position.x = (Math.random()*30)-15;
            panda.position.z = (Math.random()*30)-15;
        }
    }else{

        panda.position.lerp(
            new THREE.Vector3(
                camera.position.x,
                0,
                camera.position.z
            ),
            0.002
        );

        if(distance(panda,camera) < 2){

            document.getElementById("fade").style.opacity = 1;

            showMessage("つかまった");

            setTimeout(()=>{
                location.reload();
            },3000);
        }
    }

    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
