<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シティトライアル風 2Dミニゲーム (チャージターン実装版)</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #33a853; 
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #555;
        }
        #skill-announcement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #ffeb3b;
            text-align: center;
            font-size: 24px;
            color: #ffeb3b;
            animation: fadeOut 4s forwards;
            pointer-events: none;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -60%); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui-overlay">
        <div class="hud-panel" id="stats-panel">
            ⏱️ TIME: <span id="timer">60</span>s<br>
            🔴 SPEED: <span id="stat-speed">1</span><br>
            🔵 ACCEL: <span id="stat-accel">1</span><br>
            🟢 TURN: <span id="stat-turn">1</span>
        </div>
        <div class="hud-panel" id="skill-panel">
            【Fキー】専用スキル:<br>
            <span id="skill-name" style="color: #ffeb3b;">抽選中...</span>
        </div>
    </div>
    <div id="skill-announcement">
        獲得スキル: <span id="announce-name">???</span><br>
        <span style="font-size: 14px; color: #fff;">[F]キーで発動！</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- ゲーム設定 ---
const MAP_SIZE = 2000; 
const GAME_DURATION = 60; 

// プレイヤー（マシン）情報
const player = {
    x: MAP_SIZE / 2,
    y: MAP_SIZE / 2,
    vx: 0,
    vy: 0,
    angle: 0,
    radius: 18,
    baseSpeed: 5,
    accelRate: 0.4,
    friction: 0.94, // 滑り感を出すために少し摩擦を減衰（0.92 -> 0.94）
    patchSpeed: 0,
    patchAccel: 0,
    patchTurn: 0,
    charge: 0,
    maxCharge: 100,
    isCharging: false,
    dashTimer: 0,
    skill: null,
    skillCooldown: 0,
    invincibleTimer: 0
};

// スキルリスト
const SKILLS = [
    { id: 'plasma', name: 'プラズマウェーブ', color: '#00ffff' },
    { id: 'freeze', name: 'フリーズブリザード', color: '#a3e5ff' },
    { id: 'wheel', name: 'ホイールダッシュ', color: '#ff5722' }
];

// 割り当てられたスキルをランダム決定
player.skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
document.getElementById('skill-name').innerText = player.skill.name;
document.getElementById('skill-name').style.color = player.skill.color;
document.getElementById('announce-name').innerText = player.skill.name;
document.getElementById('announce-name').style.color = player.skill.color;

const items = [];
const buildings = [];
const projectiles = [];
const particles = [];

const keys = { w: false, a: false, s: false, d: false, Space: false, f: false };

// --- マップ生成 ---
for (let i = 0; i < 40; i++) {
    buildings.push({
        x: Math.random() * (MAP_SIZE - 200) + 100,
        y: Math.random() * (MAP_SIZE - 200) + 100,
        w: Math.random() * 100 + 60,
        h: Math.random() * 100 + 60
    });
}
function spawnItem() {
    const types = ['speed', 'accel', 'turn'];
    items.push({
        x: Math.random() * MAP_SIZE,
        y: Math.random() * MAP_SIZE,
        type: types[Math.floor(Math.random() * types.length)],
        radius: 12
    });
}
for (let i = 0; i < 50; i++) spawnItem();

// --- キーボードイベント ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW') keys.w = true;
    if (e.code === 'KeyA') keys.a = true;
    if (e.code === 'KeyS') keys.s = true;
    if (e.code === 'KeyD') keys.d = true;
    if (e.code === 'Space') keys.Space = true;
    if (e.code === 'KeyF') {
        if (!keys.f) useSkill();
        keys.f = true;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') keys.w = false;
    if (e.code === 'KeyA') keys.a = false;
    if (e.code === 'KeyS') keys.s = false;
    if (e.code === 'KeyD') keys.d = false;
    if (e.code === 'Space') {
        keys.Space = false;
        triggerChargeDash();
    }
    if (e.code === 'KeyF') keys.f = false;
});

// --- スキル発動 ---
function useSkill() {
    if (player.skillCooldown > 0 || timeLeft <= 0) return;

    if (player.skill.id === 'plasma') {
        projectiles.push({
            x: player.x, y: player.y,
            vx: Math.cos(player.angle) * 15, vy: Math.sin(player.angle) * 15,
            radius: 15, color: '#00ffff', life: 40
        });
        player.skillCooldown = 90;
    } 
    else if (player.skill.id === 'freeze') {
        for (let angle = 0; angle < Math.PI * 2; angle += 0.4) {
            projectiles.push({
                x: player.x, y: player.y,
                vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6,
                radius: 10, color: '#a3e5ff', life: 25
            });
        }
        player.skillCooldown = 180;
    } 
    else if (player.skill.id === 'wheel') {
        // ホイールダッシュ発動（初期の推進力だけ与え、制限はループ内で爆上げ）
        player.invincibleTimer = 180; // 3秒間
        player.dashTimer = 40; 
        player.vx = Math.cos(player.angle) * 18;
        player.vy = Math.sin(player.angle) * 18;
        player.skillCooldown = 300;
    }

    for (let i = 0; i < 15; i++) {
        particles.push({
            x: player.x, y: player.y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            radius: Math.random() * 6 + 2, color: player.skill.color, life: 20
        });
    }
}

// チャージダッシュ発動
function triggerChargeDash() {
    if (player.charge > 10) {
        const dashPower = (player.charge / 100) * (9 + player.patchAccel * 1.5);
        // 現在向いている方向（チャージターンで変えた向き）へダッシュ！
        player.vx = Math.cos(player.angle) * dashPower;
        player.vy = Math.sin(player.angle) * dashPower;
        player.dashTimer = 20;
        
        for(let i=0; i<12; i++){
            particles.push({
                x: player.x, y: player.y,
                vx: -Math.cos(player.angle)*3 + (Math.random()-0.5)*4,
                vy: -Math.sin(player.angle)*3 + (Math.random()-0.5)*4,
                radius: Math.random()*8 + 4, color: '#fff', life: 15
            });
        }
    }
    player.charge = 0;
    player.isCharging = false;
}

// --- タイマー ---
let timeLeft = GAME_DURATION;
const timerInterval = setInterval(() => {
    if (timeLeft > 0) {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
    } else {
        clearInterval(timerInterval);
    }
}, 1000);

// --- メインループ ---
function update() {
    if (timeLeft <= 0) return drawEndScreen();

    if (player.skillCooldown > 0) player.skillCooldown--;
    if (player.invincibleTimer > 0) player.invincibleTimer--;
    if (player.dashTimer > 0) player.dashTimer--;

    let ax = 0;
    let ay = 0;
    const currentAccel = player.accelRate + (player.patchAccel * 0.1);

    // WASDの入力受付
    if (keys.w) ay -= currentAccel;
    if (keys.s) ay += currentAccel;
    if (keys.a) ax -= currentAccel;
    if (keys.d) ax += currentAccel;

    if (keys.Space) {
        player.isCharging = true;
        // ★アップデート：急ブレーキ(vx *= 0.7)を廃止。アクセル（ax, ay）をゼロにして滑らせる！
        ax = 0;
        ay = 0;

        // 速度が少し落ちてきたらチャージ開始
        let currentSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
        if (currentSpeed < 4.5) {
            player.charge = Math.min(player.maxCharge, player.charge + 2.5 + player.patchTurn * 0.4);
        }
    }

    // ★アップデート：ホイールダッシュ中の旋回＆加速処理
    if (player.invincibleTimer > 0 && player.skill.id === 'wheel') {
        // ホイール中もWASDで向きは変えられるが、常にマシンの正面へ超強力な推進力を足し続ける
        ax += Math.cos(player.angle) * 1.5;
        ay += Math.sin(player.angle) * 1.5;
    }

    // 速度に加速度を適用
    player.vx += ax;
    player.vy += ay;

    // 摩擦（慣性減速）の適用
    // チャージ中または何も押していない時は自然に滑る
    if ((!keys.w && !keys.s && !keys.a && !keys.d) || keys.Space) {
        player.vx *= player.friction;
        player.vy *= player.friction;
    }

    // 最高速度の上限計算
    let currentMaxSpeed = player.baseSpeed + (player.patchSpeed * 1.5);
    if (player.invincibleTimer > 0 && player.skill.id === 'wheel') {
        currentMaxSpeed *= 2.8; // ホイールダッシュ中は最高速度上限を2.8倍に跳ね上げる
    }

    const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
    if (speed > currentMaxSpeed && player.dashTimer <= 0) {
        player.vx = (player.vx / speed) * currentMaxSpeed;
        player.vy = (player.vy / speed) * currentMaxSpeed;
    }

    // 位置更新
    player.x += player.vx;
    player.y += player.vy;

    // プレイヤーの向きの計算（チャージ中・通常移動中・ホイール中いつでも方向転換可能）
    if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
        // WASDが押されている場合は、その入力方向を優先して向く（チャージターン用）
        let targetAngle = player.angle;
        if (keys.w || keys.s || keys.a || keys.d) {
            let inputX = 0; let inputY = 0;
            if (keys.w) inputY -= 1; if (keys.s) inputY += 1;
            if (keys.a) inputX -= 1; if (keys.d) inputX += 1;
            targetAngle = Math.atan2(inputY, inputX);
        } else {
            // キーが押されてなければ現在の進んでいる方向を向く
            targetAngle = Math.atan2(player.vy, player.vx);
        }

        const turnSpeed = 0.12 + (player.patchTurn * 0.04);
        let diff = targetAngle - player.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.angle += diff * turnSpeed;
    }

    // 壁・マップ外の判定
    player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

    buildings.forEach(b => {
        if (player.x + player.radius > b.x && player.x - player.radius < b.x + b.w &&
            player.y + player.radius > b.y && player.y - player.radius < b.y + b.h) {
            const fromLeft = player.x - b.x;
            const fromRight = (b.x + b.w) - player.x;
            const fromTop = player.y - b.y;
            const fromBottom = (b.y + b.h) - player.y;
            const minDist = Math.min(fromLeft, fromRight, fromTop, fromBottom);

            if (minDist === fromLeft) { player.x = b.x - player.radius; player.vx *= -0.4; }
            else if (minDist === fromRight) { player.x = b.x + b.w + player.radius; player.vx *= -0.4; }
            else if (minDist === fromTop) { player.y = b.y - player.radius; player.vy *= -0.4; }
            else if (minDist === fromBottom) { player.y = b.y + b.h + player.radius; player.vy *= -0.4; }
        }
    });

    // アイテム回収
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dx = player.x - item.x;
        const dy = player.y - item.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (player.invincibleTimer > 0 && player.skill.id === 'freeze' && dist < 220) {
            item.x += (player.x - item.x) * 0.1;
            item.y += (player.y - item.y) * 0.1;
        }

        if (dist < player.radius + item.radius) {
            if (item.type === 'speed') { player.patchSpeed++; document.getElementById('stat-speed').innerText = player.patchSpeed + 1; }
            if (item.type === 'accel') { player.patchAccel++; document.getElementById('stat-accel').innerText = player.patchAccel + 1; }
            if (item.type === 'turn') { player.patchTurn++; document.getElementById('stat-turn').innerText = player.patchTurn + 1; }
            
            for(let p=0; p<5; p++) {
                particles.push({
                    x: item.x, y: item.y,
                    vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                    radius: Math.random()*4+2,
                    color: item.type === 'speed' ? '#ff3b30' : item.type === 'accel' ? '#007aff' : '#34c759',
                    life: 15
                });
            }
            items.splice(i, 1);
            spawnItem();
        }
    }

    projectiles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        if(p.life <= 0) projectiles.splice(idx, 1);
    });
    particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        if(p.life <= 0) particles.splice(idx, 1);
    });

    // --- 描画 ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let x = 0; x <= MAP_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= MAP_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
    }

    // 建物
    ctx.fillStyle = '#7a7a7a';
    buildings.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
    });

    // アイテム
    items.forEach(item => {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = item.type === 'speed' ? '#ff3b30' : item.type === 'accel' ? '#007aff' : '#34c759';
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(item.type[0].toUpperCase(), item.x, item.y);
    });

    projectiles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
    });

    particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
    });

    // プレイヤー描画
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    if (player.isCharging) {
        ctx.beginPath();
        ctx.arc(0, 0, player.radius + (player.charge/3), 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, 235, 59, ${player.charge / 130})`;
        ctx.fill();
    }
    if (player.invincibleTimer > 0) {
        ctx.beginPath(); ctx.arc(0, 0, player.radius + 6, 0, Math.PI*2);
        ctx.strokeStyle = player.skill.color; ctx.lineWidth = 4; ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8da1'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#333'; ctx.fillRect(5, -6, 8, 12); // 正面マーカー
    ctx.restore();

    // ゲージ類
    if (player.isCharging && player.charge > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(player.x - 25, player.y - 35, 50, 6);
        ctx.fillStyle = '#ffeb3b'; ctx.fillRect(player.x - 25, player.y - 35, (player.charge / player.maxCharge) * 50, 6);
    }
    if (player.skillCooldown > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(player.x - 20, player.y + 28, 40, 4);
        ctx.fillStyle = '#ff3b30'; ctx.fillRect(player.x - 20, player.y + 28, (player.skillCooldown / 300) * 40, 4);
    }

    ctx.restore();
    requestAnimationFrame(update);
}

function drawEndScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚡ タイムアップ！ ⚡', canvas.width / 2, canvas.height / 2 - 100);
    ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif';
    ctx.fillText(`最終スキル: ${player.skill.name}`, canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#ff3b30'; ctx.fillText(`🔴 最高速(SPEED)パッチ: +${player.patchSpeed}`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillStyle = '#007aff'; ctx.fillText(`🔵 加速度(ACCEL)パッチ: +${player.patchAccel}`, canvas.width / 2, canvas.height / 2 + 45);
    ctx.fillStyle = '#34c759'; ctx.fillText(`🟢 旋回力(TURN)パッチ : +${player.patchTurn}`, canvas.width / 2, canvas.height / 2 + 80);
    ctx.fillStyle = '#aaa'; ctx.font = '16px sans-serif';
    ctx.fillText('ページをリロード(F5)すると、別のスキルで再スタートします。', canvas.width / 2, canvas.height / 2 + 150);
}

requestAnimationFrame(update);
</script>

</body>
</html>
