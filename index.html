<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOFTOP HORROR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:20px;
    opacity:0.8;
}

#objective{
    position:absolute;
    top:20px;
    left:20px;
    width:420px;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
    padding:16px;
    line-height:1.8;
    font-size:14px;
}

#message{
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    padding:12px 20px;
    opacity:0;
    transition:0.3s;
    font-size:15px;
}

#stamina{
    position:absolute;
    left:20px;
    bottom:20px;
    width:220px;
    height:12px;
    border:1px solid white;
}

#staminaFill{
    width:100%;
    height:100%;
    background:white;
}

#flashlight{
    position:absolute;
    right:20px;
    bottom:20px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 14px;
    font-size:14px;
}

#powerInfo{
    position:absolute;
    right:20px;
    top:20px;
    width:280px;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
    padding:14px;
    line-height:1.8;
    font-size:14px;
}

#fade{
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:1s;
}

</style>
</head>

<body>

<div id="ui">

<div id="crosshair">+</div>

<div id="objective">

<b>OBJECTIVE</b><br><br>

施設の電力を復旧する。<br><br>

・左の倉庫へ行く<br>
・右の監視室へ行く<br>
・中央ブレーカーを起動<br>
・管理室へ入る<br><br>

WASD : 移動<br>
SHIFT : ダッシュ<br>
E : 調べる<br>
F : ライト ON/OFF<br>
矢印キー : 視点移動

</div>

<div id="powerInfo"></div>

<div id="message"></div>

<div id="stamina">
<div id="staminaFill"></div>
</div>

<div id="flashlight">
FLASHLIGHT : OFF
</div>

<div id="fade"></div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(
    0x555555,
    40,
    90
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,22);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.setClearColor(0x555555);

document.body.appendChild(
    renderer.domElement
);

const ambient =
new THREE.AmbientLight(
    0xffffff,
    1.3
);

scene.add(ambient);

const sun =
new THREE.DirectionalLight(
    0xffffff,
    1.2
);

sun.position.set(20,40,20);

scene.add(sun);

const flashlight =
new THREE.SpotLight(
    0xffffff,
    0
);

flashlight.angle = 0.8;
flashlight.penumbra = 0.6;
flashlight.distance = 70;

scene.add(flashlight);
scene.add(flashlight.target);

let flashlightOn = false;

const floor =
new THREE.Mesh(
    new THREE.PlaneGeometry(160,160),
    new THREE.MeshStandardMaterial({
        color:0x6b6b6b
    })
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

const colliders = [];

function createWall(
    x,y,z,w,h,d,color=0x333333
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w,h,d
        ),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    mesh.position.set(x,y,z);

    scene.add(mesh);

    colliders.push(
        new THREE.Box3().setFromObject(mesh)
    );

    return mesh;
}

function createRoom(
    x,
    z,
    width,
    depth,
    color
){

    const h = 5;

    createWall(
        x,
        h/2,
        z - depth/2,
        width,
        h,
        1,
        color
    );

    createWall(
        x,
        h/2,
        z + depth/2,
        width,
        h,
        1,
        color
    );

    createWall(
        x - width/2,
        h/2,
        z,
        1,
        h,
        depth,
        color
    );

    createWall(
        x + width/2,
        h/2,
        z,
        1,
        h,
        depth,
        color
    );
}

createRoom(
    -25,
    0,
    18,
    18,
    0x884444
);

createRoom(
    25,
    0,
    18,
    18,
    0x444488
);

createRoom(
    0,
    -22,
    20,
    14,
    0x448844
);

createWall(0,2.5,40,90,5,1);
createWall(-45,2.5,0,1,5,80);
createWall(45,2.5,0,1,5,80);
createWall(0,2.5,-40,90,5,1);

const hallwayLight =
new THREE.PointLight(
    0xffffff,
    2.5,
    80
);

hallwayLight.position.set(
    0,
    10,
    0
);

scene.add(hallwayLight);

const storageLight =
new THREE.PointLight(
    0xffaa88,
    0,
    30
);

storageLight.position.set(
    -25,
    5,
    0
);

scene.add(storageLight);

const cameraLight =
new THREE.PointLight(
    0x88aaff,
    0,
    30
);

cameraLight.position.set(
    25,
    5,
    0
);

scene.add(cameraLight);

const managerLight =
new THREE.PointLight(
    0x88ffcc,
    0,
    30
);

managerLight.position.set(
    0,
    5,
    -22
);

scene.add(managerLight);

function createSwitch(
    x,
    z,
    color
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            1.5,
            1.5
        ),
        new THREE.MeshStandardMaterial({
            color,
            emissive:0x111111
        })
    );

    mesh.position.set(
        x,
        1,
        z
    );

    scene.add(mesh);

    return mesh;
}

const storageSwitch =
createSwitch(
    -25,
    8,
    0xff6600
);

const cameraSwitch =
createSwitch(
    25,
    8,
    0x0066ff
);

const breakerSwitch =
createSwitch(
    0,
    -8,
    0x00ffaa
);

const managerDoor =
new THREE.Mesh(
    new THREE.BoxGeometry(
        5,
        4,
        0.5
    ),
    new THREE.MeshStandardMaterial({
        color:0x777777
    })
);

managerDoor.position.set(
    0,
    2,
    -15
);

scene.add(managerDoor);

const enemy =
new THREE.Group();

const enemyBody =
new THREE.Mesh(
    new THREE.SphereGeometry(
        1.2,
        32,
        32
    ),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

enemyBody.position.y = 1.2;

const enemyHead =
new THREE.Mesh(
    new THREE.SphereGeometry(
        0.9,
        32,
        32
    ),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

enemyHead.position.y = 3;

const eye1 =
new THREE.Mesh(
    new THREE.SphereGeometry(0.12),
    new THREE.MeshBasicMaterial({
        color:0xff0000
    })
);

eye1.position.set(
    -0.2,
    3,
    0.8
);

const eye2 = eye1.clone();

eye2.position.x = 0.2;

enemy.add(enemyBody);
enemy.add(enemyHead);
enemy.add(eye1);
enemy.add(eye2);

enemy.position.set(
    0,
    0,
    28
);

scene.add(enemy);

const keys = {};

document.addEventListener(
    "keydown",
    (e)=>{

        keys[e.code] = true;

        if(e.code === "KeyF"){

            flashlightOn =
            !flashlightOn;

            flashlight.intensity =
            flashlightOn ? 9 : 0;

            document.getElementById(
                "flashlight"
            ).innerHTML =
            "FLASHLIGHT : " +
            (
                flashlightOn
                ? "ON"
                : "OFF"
            );
        }
    }
);

document.addEventListener(
    "keyup",
    (e)=>{
        keys[e.code] = false;
    }
);

let yaw = 0;
let pitch = 0;
let stamina = 100;

const message =
document.getElementById(
    "message"
);

function showMessage(text){

    message.innerHTML = text;

    message.style.opacity = 1;

    setTimeout(()=>{
        message.style.opacity = 0;
    },3000);
}

showMessage(
    "各エリアの電力を復旧せよ"
);

let storagePowered = false;
let cameraPowered = false;
let breakerPowered = false;

function updatePowerUI(){

    document.getElementById(
        "powerInfo"
    ).innerHTML = `
    <b>POWER STATUS</b><br><br>

    倉庫 :
    ${storagePowered ? "ONLINE" : "OFFLINE"}<br>

    監視室 :
    ${cameraPowered ? "ONLINE" : "OFFLINE"}<br>

    管理室 :
    ${breakerPowered ? "OPEN" : "LOCKED"}
    `;
}

updatePowerUI();

function distance(a,b){

    return a.position.distanceTo(
        b.position
    );
}

function interact(){

    if(
        distance(camera,storageSwitch) < 3
    ){

        storagePowered = true;

        storageLight.intensity = 4;

        storageSwitch.material.emissive
        .setHex(0xff6600);

        showMessage(
            "倉庫へ送電した"
        );

        updatePowerUI();
    }

    if(
        distance(camera,cameraSwitch) < 3
    ){

        cameraPowered = true;

        cameraLight.intensity = 4;

        cameraSwitch.material.emissive
        .setHex(0x0066ff);

        showMessage(
            "監視室へ送電した"
        );

        updatePowerUI();
    }

    if(
        distance(camera,breakerSwitch) < 3
    ){

        if(
            storagePowered &&
            cameraPowered
        ){

            breakerPowered = true;

            managerLight.intensity = 4;

            managerDoor.position.y = -5;

            showMessage(
                "管理室が解放された"
            );

            updatePowerUI();

        }else{

            showMessage(
                "全エリアへの送電が必要"
            );
        }
    }

    if(
        distance(camera,managerDoor) < 5 &&
        breakerPowered
    ){

        document.getElementById(
            "fade"
        ).style.opacity = 1;

        showMessage(
            "CHAPTER 1 CLEAR"
        );
    }
}

document.addEventListener(
    "keydown",
    (e)=>{

        if(e.code === "KeyE"){
            interact();
        }
    }
);

function checkCollision(position){

    const playerBox =
    new THREE.Box3(
        new THREE.Vector3(
            position.x - 0.5,
            position.y - 1,
            position.z - 0.5
        ),
        new THREE.Vector3(
            position.x + 0.5,
            position.y + 1,
            position.z + 0.5
        )
    );

    for(const box of colliders){

        if(
            playerBox.intersectsBox(box)
        ){
            return true;
        }
    }

    return false;
}

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
    clock.getDelta();

    let moveSpeed = 5;

    if(
        keys["ShiftLeft"] &&
        stamina > 0
    ){

        moveSpeed = 9;

        stamina -= 28 * delta;

    }else{

        stamina += 18 * delta;
    }

    stamina = Math.max(
        0,
        Math.min(100,stamina)
    );

    document.getElementById(
        "staminaFill"
    ).style.width =
    stamina + "%";

    if(keys["ArrowLeft"]){
        yaw += 1.8 * delta;
    }

    if(keys["ArrowRight"]){
        yaw -= 1.8 * delta;
    }

    if(keys["ArrowUp"]){
        pitch += 1.3 * delta;
    }

    if(keys["ArrowDown"]){
        pitch -= 1.3 * delta;
    }

    pitch = Math.max(
        -1.2,
        Math.min(1.2,pitch)
    );

    camera.rotation.order =
    "YXZ";

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const forward =
    new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    const right =
    new THREE.Vector3(
        -forward.z,
        0,
        forward.x
    );

    const oldPosition =
    camera.position.clone();

    if(keys["KeyW"]){

        camera.position.addScaledVector(
            forward,
            moveSpeed * delta
        );
    }

    if(keys["KeyS"]){

        camera.position.addScaledVector(
            forward,
            -moveSpeed * delta
        );
    }

    if(keys["KeyA"]){

        camera.position.addScaledVector(
            right,
            -moveSpeed * delta
        );
    }

    if(keys["KeyD"]){

        camera.position.addScaledVector(
            right,
            moveSpeed * delta
        );
    }

    if(
        checkCollision(
            camera.position
        )
    ){

        camera.position.copy(
            oldPosition
        );
    }

    flashlight.position.copy(
        camera.position
    );

    const direction =
    new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    flashlight.target.position.copy(
        camera.position.clone().add(
            direction.multiplyScalar(10)
        )
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
