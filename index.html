<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Air Ride Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            margin: 0 auto;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        SPEED: <span id="speed-text">0</span><br>
        CHARGE: <span id="charge-text">0%</span>
    </div>
    <div id="instructions">画面を長押しで「プッシュ（減速＆チャージ）」 / 離して「ダッシュ」</div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 画面サイズ設定（スマホ対応）
canvas.width = window.innerWidth > 800 ? 800 : window.innerWidth;
canvas.height = window.innerHeight > 450 ? 450 : window.innerHeight;

// ゲームの状態・定数
const GRAVITY = 0.4;
const TARGET_HOVER_HEIGHT = 60; // 目標とする地面からの浮遊高さ
const HOVER_SPRING = 0.08;      // ホバーの反発強さ

// マシーン（プレイヤー）のデータ
const player = {
    x: 100,
    y: 200,
    vx: 5,         // 前進速度（自動走行）
    vy: 0,
    width: 40,
    height: 20,
    isPushing: false,
    charge: 0,
    maxCharge: 100
};

// 簡単な地形データ（地面の高さの配列）
const groundY = canvas.height - 80;
function getGroundHeight(x) {
    // 凸凹の坂道をサイン波で再現
    return groundY + Math.sin(x * 0.005) * 40 + Math.cos(x * 0.01) * 20;
}

// 入力イベント（マウス＆スマホのタップに対応）
function startPush() { player.isPushing = true; }
function endPush() {
    if (player.isPushing) {
        // チャージ量に応じてダッシュ
        player.vx += (player.charge / 100) * 8;
        player.isPushing = false;
    }
}

window.addEventListener('mousedown', startPush);
window.addEventListener('mouseup', endPush);
window.addEventListener('touchstart', (e) => { e.preventDefault(); startPush(); }, {passive: false});
window.addEventListener('touchend', (e) => { e.preventDefault(); endPush(); }, {passive: false});

// メインループ
function update() {
    // 1. 自動前進とプッシュ（ブレーキ＆チャージ）
    if (player.isPushing) {
        player.vx *= 0.92; // 急ブレーキ
        if (player.vx < 1) {
            player.charge = Math.min(player.charge + 2, player.maxCharge);
        }
    } else {
        // 通常時：徐々に基本速度（5）に戻る
        player.vx += (5 - player.vx) * 0.05;
        player.charge = Math.max(player.charge - 4, 0);
    }

    // 2. 物理演算（重力）
    player.vy += GRAVITY;
    player.y += player.vy;
    player.x += player.vx; // 実際はカメラを動かすが、座標としては進める

    // 3. ホバー（浮遊）処理 [Raycastの再現]
    const currentGround = getGroundHeight(player.x);
    const distanceFromGround = currentGround - (player.y + player.height);

    if (distanceFromGround < TARGET_HOVER_HEIGHT) {
        // 地面に近づくほど強い上向きの力をかける（バネの原理）
        if (player.isPushing) {
            // プッシュ中は地面に張り付く（急降下）
            player.y = currentGround - player.height - 5;
            player.vy = 0;
        } else {
            const force = (TARGET_HOVER_HEIGHT - distanceFromGround) * HOVER_SPRING;
            player.vy -= force;
            player.vy *= 0.85; // クッション効果（ダンパー）
        }
    }

    // 画面表示の更新
    document.getElementById('speed-text').innerText = Math.round(player.vx * 10);
    document.getElementById('charge-text').innerText = Math.round(player.charge) + "%";
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // カメラの追従（プレイヤーが常に画面の左側に固定されるように背景をずらす）
    const offsetX = player.x - 150;

    // 1. 地面の描画
    ctx.fillStyle = '#654321';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let screenX = 0; screenX <= canvas.width; screenX += 5) {
        const worldX = screenX + offsetX;
        ctx.lineTo(screenX, getGroundHeight(worldX));
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // 芝生の表面
    ctx.fillStyle = '#228B22';
    ctx.beginPath();
    for (let screenX = 0; screenX <= canvas.width; screenX += 5) {
        const worldX = screenX + offsetX;
        if (screenX === 0) ctx.moveTo(screenX, getGroundHeight(worldX));
        else ctx.lineTo(screenX, getGroundHeight(worldX));
    }
    ctx.lineTo(canvas.width, canvas.height);
    // 厚みを持たせるための簡易描画
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#32CD32';
    ctx.stroke();

    // 2. マシーン（プレイヤー）の描画
    ctx.save();
    // 走行速度やチャージ状態に合わせて色を変える
    ctx.fillStyle = player.isPushing ? '#FF4500' : (player.vx > 8 ? '#00FFFF' : '#FFD700');
    
    // プレイヤーの画面内位置（Xは固定、Yだけ動く）
    const screenPlayerX = player.x - offsetX;
    
    // マシーンの本体（エアライドっぽい流線型をイメージした四角）
    ctx.fillRect(screenPlayerX, player.y, player.width, player.height);
    
    // チャージエフェクト
    if (player.charge > 0) {
        ctx.strokeStyle = `rgba(255, 69, 0, ${player.charge / 100})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(screenPlayerX - 5, player.y - 5, player.width + 10, player.height + 10);
    }
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
