<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mascot Horror - Execution Sequence</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', monospace; }
        #viewport { position: fixed; width: 100%; height: 100%; box-shadow: inset 0 0 150px #000; pointer-events: none; z-index: 5; }
        
        /* フェードアウト用の黒い幕 */
        #fade-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; opacity: 0; pointer-events: none; z-index: 100;
            transition: opacity 1.5s ease-in;
        }
        
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; }
        .hint { color: #555; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="fade-overlay"></div>
    <div id="ui">
        <div>STATUS: <span id="status" style="color: #0f0;">SURVIVING</span></div>
        <div class="hint">ヒント: 赤い立方体に触れるとキルシーン開始</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);
        scene.fog = new THREE.Fog(0x0a0a0c, 1, 45);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        const flashlight = new THREE.SpotLight(0xffffff, 200, 40, Math.PI/6, 0.3);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- マップ ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x151515}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // --- 敵 (Mascot) ---
        const enemy = new THREE.Group();
        // 顔（不気味な造形）
        const face = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1), new THREE.MeshStandardMaterial({color: 0x330000}));
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff0000}));
        eye.position.set(0.4, 0.5, 0.5);
        const eye2 = eye.clone(); eye2.position.x = -0.4;
        enemy.add(face, eye, eye2);
        enemy.position.set(0, 0, -5); // 前方に配置
        scene.add(enemy);

        // --- ゲームオーバー用トリガー（赤い箱） ---
        const trigger = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0xff0000}));
        trigger.position.set(0, 0.5, 0);
        scene.add(trigger);

        // --- ロジック変数 ---
        const keys = {};
        let isDead = false;
        let deathPhase = 0; // 0: 生存, 1: 襲撃開始, 2: フェードアウト
        let deathTimer = 0;

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            if (!isDead) {
                // 通常操作
                const speed = 0.12;
                if(keys['KeyW']) camera.translateZ(-speed);
                if(keys['KeyS']) camera.translateZ(speed);
                if(keys['KeyA']) camera.translateX(-speed);
                if(keys['KeyD']) camera.translateX(speed);
                if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
                if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;
                camera.position.y = 1.6;

                // トリガー接触判定
                if (camera.position.distanceTo(trigger.position) < 1.5) {
                    isDead = true;
                    deathPhase = 1;
                    document.getElementById('status').innerText = "CAUGHT";
                    document.getElementById('status').style.color = "#f00";
                }
            } else {
                // --- ジャンプスケア・シーケンス ---
                deathTimer += 0.016;

                // ① カメラを強制固定（敵を直視）
                // 敵の「顔」の高さ（1.5）に向けて視線を固定
                const lookTarget = new THREE.Vector3(enemy.position.x, 1.5, enemy.position.z);
                camera.lookAt(lookTarget);

                // ② 敵が自分に近づいてくる（突進）
                if (enemy.position.distanceTo(camera.position) > 0.8) {
                    const dir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                    enemy.position.add(dir.multiplyScalar(0.4)); // 高速接近
                }

                // ③ 画面の揺れとフェードアウト
                if (deathTimer > 0.5) {
                    // カメラシェイク
                    const shakeStrength = 0.15;
                    camera.position.x += (Math.random() - 0.5) * shakeStrength;
                    camera.position.y += (Math.random() - 0.5) * shakeStrength;
                    
                    // フェードアウト開始
                    document.getElementById('fade-overlay').style.opacity = 1;
                }

                // リロード
                if (deathTimer > 2.5) location.reload();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
