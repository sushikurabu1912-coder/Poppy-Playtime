<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mascot Horror - Tape & Lore</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', monospace; }
        #viewport { position: fixed; width: 100%; height: 100%; box-shadow: inset 0 0 180px #000; pointer-events: none; z-index: 5; }
        #fade-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #200; opacity: 0; pointer-events: none; z-index: 100; transition: opacity 1s; }
        
        /* 字幕（カセット用） */
        #subtitle-box {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #ffaa00; font-size: 1.4em; text-shadow: 2px 2px 5px #000;
            opacity: 0; transition: opacity 0.5s; z-index: 20;
            padding: 0 50px; box-sizing: border-box;
        }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; border-left: 3px solid #ffaa00; padding-left: 10px; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="fade-overlay"></div>
    <div id="subtitle-box"></div>
    <div id="ui">
        <div>STATUS: <span id="status">探索中</span></div>
        <div id="log-info" style="font-size: 0.8em; color: #ffaa00;">[?] カセットを探せ</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.Fog(0x050508, 1, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.45));
        const flashlight = new THREE.SpotLight(0xffffff, 250, 50, Math.PI/6, 0.4);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- カセットテープ (アイテム) ---
        const tapeGroup = new THREE.Group();
        const tapeBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.1, 0.4),
            new THREE.MeshStandardMaterial({color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 0.5})
        );
        const tapeLabel = new THREE.Mesh(
            new THREE.PlaneGeometry(0.4, 0.25),
            new THREE.MeshStandardMaterial({color: 0xffffff})
        );
        tapeLabel.rotation.x = -Math.PI/2;
        tapeLabel.position.y = 0.06;
        tapeGroup.add(tapeBody, tapeLabel);
        tapeGroup.position.set(-3, 0.1, 5); // プレイヤーの近くに配置
        scene.add(tapeGroup);

        // --- 敵 (Mascot) ---
        const enemy = new THREE.Group();
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshStandardMaterial({color: 0x440000}));
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff0000, emissiveIntensity: 2}));
        eye.position.set(0.3, 0.3, 0.4);
        const eye2 = eye.clone(); eye2.position.x = -0.3;
        enemy.add(head, eye, eye2);
        enemy.position.set(0, 1.4, -15); // 遠くに配置
        scene.add(enemy);

        // --- 地面とトリガー（死のトラップ） ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        const killTrigger = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x330000, transparent: true, opacity: 0.5}));
        killTrigger.position.set(0, 0.1, -10);
        scene.add(killTrigger);

        // --- システム変数 ---
        let isDead = false;
        let deathTimer = 0;
        const keys = {};
        const subBox = document.getElementById('subtitle-box');

        const playTape = () => {
            tapeGroup.visible = false;
            document.getElementById('log-info').innerText = "[!] 再生中...";
            
            const messages = [
                "『...聞こえるか？この施設の地下には「彼」が眠っている。』",
                "『決して、奥の赤いエリアには近づくな。』",
                "『...もし「彼」の目が光ったら、もう手遅れだ。』"
            ];
            
            messages.forEach((msg, i) => {
                setTimeout(() => {
                    subBox.innerText = msg;
                    subBox.style.opacity = 1;
                    if(i === messages.length - 1) {
                        setTimeout(() => subBox.style.opacity = 0, 3000);
                        document.getElementById('log-info').innerText = "[✓] ログ回収済み";
                    }
                }, i * 3500);
            });
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            if (!isDead) {
                const speed = 0.15;
                if(keys['KeyW']) camera.translateZ(-speed);
                if(keys['KeyS']) camera.translateZ(speed);
                if(keys['KeyA']) camera.translateX(-speed);
                if(keys['KeyD']) camera.translateX(speed);
                if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
                if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

                // カセット回収判定
                if (tapeGroup.visible && camera.position.distanceTo(tapeGroup.position) < 1.5) {
                    playTape();
                }

                // 死亡判定
                if (camera.position.distanceTo(killTrigger.position) < 2) {
                    isDead = true;
                }
            } else {
                // --- ジャンプスケア・シーケンス ---
                deathTimer += 0.016;
                camera.lookAt(enemy.position);

                if (enemy.position.distanceTo(camera.position) > 0.8) {
                    const moveDir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                    enemy.position.add(moveDir.multiplyScalar(0.5));
                }

                if (deathTimer > 0.4) {
                    camera.position.x += (Math.random() - 0.5) * 0.2;
                    camera.position.y += (Math.random() - 0.5) * 0.2;
                    document.getElementById('fade-overlay').style.opacity = 1;
                }
                if (deathTimer > 2.0) location.reload();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
