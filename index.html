<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mascot Horror Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        /* ビネット効果（画面の四隅を暗くする） */
        #viewport {
            position: fixed; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none; z-index: 5;
        }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 5px;
            border-left: 5px solid #ff00ff; z-index: 10;
        }
        #subtitle {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #ffff00; font-size: 1.5em; text-shadow: 2px 2px #000;
            opacity: 0; transition: opacity 0.3s; z-index: 10;
        }
        /* ジャンプスケアの画像（CSSで不気味な顔を模倣） */
        #jumpscare {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #f00; display: none; z-index: 100;
            justify-content: center; align-items: center;
        }
        #scare-face {
            width: 300px; height: 300px; background: #000; border-radius: 50%;
            box-shadow: 0 0 100px #fff; display: flex; justify-content: space-around; align-items: center;
        }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="ui">
        <div style="font-size: 0.7em; color: #ff00ff;">FACILITY LOG: ONLINE</div>
        <div id="mission">パズル：正しい順序でコアを集めろ</div>
        <div id="hint" style="color: #0ff; font-size: 0.9em; margin-top: 5px;">HINT: 赤 -> 青 -> 緑</div>
    </div>
    <div id="subtitle"></div>
    <div id="jumpscare">
        <div id="scare-face"><div style="width:50px;height:50px;background:#fff;border-radius:50%"></div><div style="width:50px;height:50px;background:#fff;border-radius:50%"></div></div>
        <h1 style="position:absolute; color:#fff; font-size:5em;">YOU FOUND ME</h1>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.Fog(0x020205, 1, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライト ---
        const ambient = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambient);
        const flashlight = new THREE.SpotLight(0xffffff, 200, 40, Math.PI/6, 0.4, 1.2);
        flashlight.castShadow = true;
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- マップ作成 ---
        const walls = [];
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
        const createWall = (w, h, d, x, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, h/2, z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
            walls.push(m);
        };
        // 外壁
        createWall(40, 6, 2, 0, 20); createWall(40, 6, 2, 0, -20);
        createWall(2, 6, 40, 20, 0); createWall(2, 6, 40, -20, 0);
        // 地面
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color:0x111111}));
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- パズル要素（コア） ---
        const cores = [];
        const puzzleOrder = [0xff0000, 0x0000ff, 0x00ff00]; // 赤、青、緑
        const corePos = [{x:-10, z:-5}, {x:10, z:-10}, {x:0, z:-15}];
        
        corePos.forEach((p, i) => {
            const g = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.IcosahedronGeometry(0.5, 0),
                new THREE.MeshStandardMaterial({ color: puzzleOrder[i], emissive: puzzleOrder[i], emissiveIntensity: 2 })
            );
            const light = new THREE.PointLight(puzzleOrder[i], 10, 8);
            g.add(mesh); g.add(light);
            g.position.set(p.x, 1, p.z);
            g.userData = { id: i, color: puzzleOrder[i] };
            scene.add(g);
            cores.push(g);
        });

        // --- カセットテープ ---
        const tape = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.1, 0.4),
            new THREE.MeshStandardMaterial({ color: 0xffaa00 })
        );
        tape.position.set(-5, 0.1, 5);
        scene.add(tape);

        // --- システム変数 ---
        const keys = {};
        let collectedCount = 0;
        let subTimeout;
        const subEl = document.getElementById('subtitle');
        const scareEl = document.getElementById('jumpscare');

        const speak = (txt) => {
            clearTimeout(subTimeout);
            subEl.innerText = txt; subEl.style.opacity = 1;
            subTimeout = setTimeout(() => subEl.style.opacity = 0, 4000);
        };

        const triggerJumpscare = () => {
            scareEl.style.display = 'flex';
            setTimeout(() => location.reload(), 1500); // 強制リセット
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);
            const prevPos = camera.position.clone();
            const speed = 0.13;

            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

            camera.position.y = 1.6;

            // 衝突判定
            const pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(1, 2, 1));
            walls.forEach(w => { if(pBox.intersectsBox(new THREE.Box3().setFromObject(w))) camera.position.copy(prevPos); });

            // コア回収（パズル判定）
            cores.forEach((c, idx) => {
                if(c.visible && camera.position.distanceTo(c.position) < 2) {
                    if(idx === collectedCount) {
                        c.visible = false;
                        collectedCount++;
                        speak("正しい順序だ...");
                        if(collectedCount === 3) speak("ゲートがどこかで開いた音がする...");
                    } else {
                        triggerJumpscare(); // 順番を間違えたら即死
                    }
                }
            });

            // カセット再生
            if(tape.visible && camera.position.distanceTo(tape.position) < 2) {
                tape.visible = false;
                speak("『...実験体は順調に成長している。赤、青、緑...その順序さえ守れば、奴らは大人しい...』");
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
