<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Horror - Playtime Lighting</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 5px;
            border-left: 5px solid #ffff00; pointer-events: none;
        }
        #center-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 2em; text-align: center; pointer-events: none;
            text-shadow: 0 0 10px #00ffff; opacity: 0; transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 0.8em; color: #ffff00;">OBJECTIVE</div>
        <div id="task" style="font-size: 1.2em; margin: 5px 0;">コアを3つ回収して脱出せよ</div>
        <div style="font-size: 1.1em;">CORES: <span id="fuse-count">0</span> / 3</div>
        <div style="color: #888; font-size: 0.7em; margin-top:10px;">[F] Toggle Flashlight</div>
    </div>
    <div id="center-msg"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        // Poppy Playtime風の、少し青みのある暗闇
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.Fog(0x020205, 2, 45);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 18); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ReinhardToneMapping; // リアルな光の減衰
        document.body.appendChild(renderer.domElement);

        // --- ライティング調整 ---
        // 環境光：真っ暗にならないよう、少しだけ底上げ
        const ambient = new THREE.AmbientLight(0x404040, 0.2); 
        scene.add(ambient);

        // 懐中電灯：中心を明るく、縁を柔らかく（Poppy風）
        const flashlight = new THREE.SpotLight(0xffffff, 250);
        flashlight.angle = Math.PI / 6;
        flashlight.penumbra = 0.4; // 縁の柔らかさ
        flashlight.decay = 1.2;    // 自然な減衰
        flashlight.distance = 50;
        flashlight.castShadow = true;
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- マテリアル ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.1 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });

        // --- マップ構築 ---
        const walls = [];
        const createWall = (w, h, d, x, z, mat = wallMat) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, h/2, z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
            walls.push(m);
            return m;
        };

        // メインエリア
        createWall(40, 6, 2, 0, 25);   // スタート背後
        createWall(2, 6, 60, -20, 0);  // 左外壁
        createWall(2, 6, 60, 20, 0);   // 右外壁
        createWall(40, 6, 2, 0, -35);  // 正面奥
        
        // 内部の仕切り（迷路要素）
        createWall(15, 5, 2, -10, 5);
        createWall(15, 5, 2, 10, -10);
        createWall(2, 5, 20, 0, -20);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- コア ---
        const cores = [];
        const corePos = [{x:-15, z:10}, {x:15, z:-25}, {x:-5, z:-30}];
        corePos.forEach(p => {
            const group = new THREE.Group();
            const f = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 })
            );
            const light = new THREE.PointLight(0x00ffff, 10, 5);
            group.add(f);
            group.add(light);
            group.position.set(p.x, 1, p.z);
            scene.add(group);
            cores.push(group);
        });

        // --- 脱出ゲート ---
        const gate = createWall(8, 6, 1, 0, 24, new THREE.MeshStandardMaterial({color: 0xff0000}));

        // --- ロジック ---
        const keys = {};
        let collected = 0;
        let isLightOn = true;

        const showMsg = (txt) => {
            const el = document.getElementById('center-msg');
            el.innerText = txt; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        };

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'KeyF') {
                isLightOn = !isLightOn;
                flashlight.intensity = isLightOn ? 250 : 0;
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            const prevPos = camera.position.clone();
            const speed = 0.15;

            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

            camera.position.y = 1.6;

            // 衝突判定
            const playerBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(1, 2, 1));
            for(let wall of walls) {
                if(playerBox.intersectsBox(new THREE.Box3().setFromObject(wall))) {
                    camera.position.copy(prevPos);
                    break;
                }
            }

            // 回収判定
            cores.forEach(c => {
                c.rotation.y += 0.05;
                if(c.visible && camera.position.distanceTo(c.position) < 2) {
                    c.visible = false;
                    collected++;
                    document.getElementById('fuse-count').innerText = collected;
                    if(collected === 3) {
                        showMsg("ゲート開放。背後へ向かえ。");
                        gate.position.y = 10; // ゲートが開く
                        gate.material.color.setHex(0x00ff00);
                    }
                }
            });

            // 脱出判定
            if(collected === 3 && camera.position.z > 23) {
                showMsg("クリア！");
                setTimeout(() => location.reload(), 3000);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
