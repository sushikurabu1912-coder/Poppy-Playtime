<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Poppy Playtime - Keyboard Only Edition</title>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #game-view { 
            position: relative; width: 800px; height: 500px; margin: 50px auto; 
            border: 10px solid #222; overflow: hidden; background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }
        
        /* 視点移動するステージ */
        #stage {
            position: absolute; width: 2000px; height: 100%; left: -600px;
            transition: left 0.1s linear;
        }

        /* 背景：不気味なタイルと柱 */
        .bg-pattern {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                linear-gradient(90deg, #111 2px, transparent 2px),
                linear-gradient(#111 2px, transparent 2px);
            background-size: 100px 100px;
            opacity: 0.5;
        }

        /* キャラクター */
        #huggy { 
            position: absolute; width: 200px; bottom: 80px; left: 900px; 
            font-size: 120px; text-align: center; transition: transform 0.1s;
            filter: drop-shadow(0 0 10px #00f);
        }

        /* ターゲットスイッチ */
        .target { 
            position: absolute; width: 120px; height: 120px; background: #222; 
            border: 6px inset #444; top: 180px; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }
        .target b { font-size: 24px; margin-bottom: 5px; }
        #target-l { left: 400px; border-color: #0055ff; color: #0055ff; }
        #target-r { left: 1480px; border-color: #ff0000; color: #ff0000; }
        .active { background: #fff !important; box-shadow: 0 0 40px #fff; color: #000 !important; }

        /* グラブパック（画面固定） */
        .hand { position: absolute; width: 100px; bottom: -30px; transition: 0.15s ease-out; z-index: 100; }
        #hand-left { left: 150px; transform: translateY(200px); filter: hue-rotate(0deg); }
        #hand-right { right: 150px; transform: translateY(200px); filter: hue-rotate(140deg); }

        #ui { text-align: center; margin-top: 20px; }
        .kbd { background: #444; padding: 2px 8px; border-radius: 4px; border-bottom: 3px solid #222; }
    </style>
</head>
<body>

<div id="ui">
    <h2>FACTORY SECURITY MONITOR</h2>
    <p>視点移動: <span class="kbd">←</span> <span class="kbd">→</span> | 青い手: <span class="kbd">A</span> | 赤い手: <span class="kbd">D</span></p>
    <h3 id="status" style="color: #0f0;">SYSTEM ONLINE</h3>
</div>

<div id="game-view">
    <div id="stage">
        <div class="bg-pattern"></div>
        <div id="target-l" class="target"><b>[A]</b>PUSH</div>
        <div id="target-r" class="target"><b>[D]</b>PUSH</div>
        <div id="huggy">👹</div>
    </div>
    
    <img id="hand-left" class="hand" src="https://img.icons8.com/color/96/blue-hand.png">
    <img id="hand-right" class="hand" src="https://img.icons8.com/color/96/red-hand.png">
</div>

<script>
    const stage = document.getElementById('stage');
    const huggy = document.getElementById('huggy');
    const statusText = document.getElementById('status');
    const handL = document.getElementById('hand-left');
    const handR = document.getElementById('hand-right');

    let cameraX = -600;
    let huggyScale = 1;
    let gameOver = false;

    // キーボード入力の状態管理
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // 単発押しイベント（AキーとDキー）
    window.addEventListener('keydown', (e) => {
        if (gameOver) return;
        if (e.code === 'KeyA') shoot('L');
        if (e.code === 'KeyD') shoot('R');
    });

    function shoot(side) {
        const hand = (side === 'L') ? handL : handR;
        const target = (side === 'L') ? document.getElementById('target-l') : document.getElementById('target-r');
        
        // アニメーション
        hand.style.transform = "translateY(-400px)";
        
        setTimeout(() => {
            // 当たり判定：ターゲットが画面の一定範囲内にあるか
            // ステージの左端からの距離とcameraXの関係で判定
            const targetPos = (side === 'L') ? (400 + cameraX) : (1480 + cameraX);
            
            // 画面中央（400px付近）にターゲットがいればヒット
            if (targetPos > 250 && targetPos < 450) {
                target.classList.add('active');
                huggyScale = Math.max(0.5, huggyScale - 0.4);
                statusText.innerText = "CRITICAL HIT!";
                statusText.style.color = "#fff";
                setTimeout(() => { statusText.innerText = "KEEP DISTANCE"; statusText.style.color = "#ff0"; }, 500);
            }

            setTimeout(() => {
                hand.style.transform = "translateY(200px)";
                target.classList.remove('active');
            }, 300);
        }, 150);
    }

    // ゲームループ（移動とハギーの接近）
    function update() {
        if (gameOver) return;

        // 視点移動
        if (keys['ArrowLeft']) cameraX += 12;
        if (keys['ArrowRight']) cameraX -= 12;
        
        // 移動範囲制限
        cameraX = Math.min(Math.max(cameraX, -1200), 0);
        stage.style.left = cameraX + "px";

        // ハギー接近
        huggyScale += 0.004;
        huggy.style.transform = `scale(${huggyScale})`;

        if (huggyScale > 5) {
            gameOver = true;
            statusText.innerText = "FATAL ERROR: TOY BREACHED";
            statusText.style.color = "red";
            huggy.innerText = "💀";
            document.body.style.backgroundColor = "#200";
        }

        requestAnimationFrame(update);
    }

    update();
</script>
</body>
</html>
