<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced Puzzle - Mascot Horror</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', monospace; }
        #viewport { position: fixed; width: 100%; height: 100%; box-shadow: inset 0 0 180px #000; pointer-events: none; z-index: 5; }
        #fade-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #200; opacity: 0; pointer-events: none; z-index: 100; transition: opacity 1s; }
        #subtitle-box { position: absolute; bottom: 15%; width: 100%; text-align: center; color: #ffaa00; font-size: 1.4em; text-shadow: 2px 2px 5px #000; opacity: 0; transition: opacity 0.5s; z-index: 20; padding: 0 50px; box-sizing: border-box; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; border-left: 3px solid #0ff; padding-left: 10px; background: rgba(0,0,0,0.5); padding: 10px; }
        .counter { display: inline-block; width: 20px; height: 10px; background: #333; margin: 2px; }
        .active-led { background: #0f0; box-shadow: 0 0 5px #0f0; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="fade-overlay"></div>
    <div id="subtitle-box"></div>
    <div id="ui">
        <div style="font-size: 0.7em; color: #0ff;">SECURITY LEVEL: 4</div>
        <div id="mission-title">TASK: システムを復旧せよ</div>
        <div id="puzzle-status" style="font-size: 0.9em; margin-top: 5px; color: #aaa;">
            [1] バッテリー: <span id="s1">未</span><br>
            [2] コード入力: <span id="s2">0/3</span><br>
            [3] 最終認証: <span id="s3">待機</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.Fog(0x050508, 1, 45);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const flashlight = new THREE.SpotLight(0xffffff, 250, 50, Math.PI/6, 0.4);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- 敵 (Mascot) ---
        const enemy = new THREE.Group();
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshStandardMaterial({color: 0x440000}));
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff0000, emissiveIntensity: 2}));
        eye.position.set(0.3, 0.3, 0.4);
        const eye2 = eye.clone(); eye2.position.x = -0.3;
        enemy.add(head, eye, eye2);
        enemy.position.set(0, 1.4, -30); // 最初は遠くに
        scene.add(enemy);

        // --- パズルオブジェクト ---
        // 1. バッテリー
        const battery = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5), new THREE.MeshStandardMaterial({color: 0x00ff00, emissive: 0x00ff00}));
        battery.position.set(-10, 0.25, 5);
        scene.add(battery);

        // 2. ターミナル
        const terminal = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 0.5), new THREE.MeshStandardMaterial({color: 0x333333}));
        terminal.position.set(0, 1, -5);
        scene.add(terminal);

        // 3. 数字パネル（ヒント）
        const hintPanel = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({color: 0x111111}));
        hintPanel.position.set(10, 2, -10);
        scene.add(hintPanel);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // --- システム変数 ---
        let isDead = false;
        let deathTimer = 0;
        let puzzleState = "GET_BATTERY"; 
        let codeProgress = 0;
        let authTimer = 0;
        const keys = {};
        const subBox = document.getElementById('subtitle-box');

        const showSub = (txt) => {
            subBox.innerText = txt; subBox.style.opacity = 1;
            setTimeout(() => subBox.style.opacity = 0, 3000);
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            if (!isDead) {
                const speed = 0.15;
                if(keys['KeyW']) camera.translateZ(-speed);
                if(keys['KeyS']) camera.translateZ(speed);
                if(keys['KeyA']) camera.translateX(-speed);
                if(keys['KeyD']) camera.translateX(speed);
                if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
                if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

                // [1] バッテリー回収
                if (puzzleState === "GET_BATTERY" && camera.position.distanceTo(battery.position) < 1.5) {
                    battery.visible = false;
                    puzzleState = "INSERT_BATTERY";
                    document.getElementById('s1').innerText = "所持";
                    showSub("バッテリーを拾った。ターミナルへ運べ。");
                }

                // [2] ターミナルへ挿入
                if (puzzleState === "INSERT_BATTERY" && camera.position.distanceTo(terminal.position) < 2) {
                    puzzleState = "INPUT_CODE";
                    document.getElementById('s1').innerText = "完了";
                    showSub("電力が復旧した。パネルを3回クリックして認証しろ。");
                }

                // [3] コード入力（簡易的にターミナルへの接近回数で再現）
                if (puzzleState === "INPUT_CODE" && camera.position.distanceTo(terminal.position) < 1.5) {
                    // クールダウン付きの加算
                    if (!this.lastHit || Date.now() - this.lastHit > 1000) {
                        codeProgress++;
                        this.lastHit = Date.now();
                        document.getElementById('s2').innerText = codeProgress + "/3";
                        if (codeProgress >= 3) {
                            puzzleState = "FINAL_AUTH";
                            showSub("最終認証開始。ゲート前で待機しろ...");
                            // 敵を背後にこっそり移動させる
                            enemy.position.set(camera.position.x, 1.4, camera.position.z + 10);
                        }
                    }
                }

                // [4] 最終認証（待機時間中に敵が迫る）
                if (puzzleState === "FINAL_AUTH") {
                    authTimer += 0.016;
                    document.getElementById('s3').innerText = Math.floor(authTimer * 20) + "%";
                    
                    // 敵がゆっくり近づく
                    const dir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                    enemy.position.add(dir.multiplyScalar(0.03));

                    if (camera.position.distanceTo(enemy.position) < 2) isDead = true;
                    if (authTimer > 5) {
                        puzzleState = "CLEAR";
                        showSub("認証完了。脱出可能。");
                    }
                }

            } else {
                // ジャンプスケア
                deathTimer += 0.016;
                camera.lookAt(new THREE.Vector3(enemy.position.x, 1.8, enemy.position.z));
                const dist = enemy.position.distanceTo(camera.position);
                if (dist > 0.8) {
                    const moveDir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                    enemy.position.add(moveDir.multiplyScalar(0.5));
                }
                if (deathTimer > 0.4) {
                    camera.position.x += (Math.random() - 0.5) * 0.2;
                    camera.position.y += (Math.random() - 0.5) * 0.2;
                    document.getElementById('fade-overlay').style.opacity = 1;
                }
                if (deathTimer > 2.0) location.reload();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
