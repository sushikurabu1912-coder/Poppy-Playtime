<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ROOFTOP HORROR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:20px;
    opacity:0.8;
}

#objective{
    position:absolute;
    top:20px;
    left:20px;
    width:430px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.2);
    padding:16px;
    line-height:1.8;
    font-size:14px;
}

#message{
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    padding:12px 20px;
    opacity:0;
    transition:0.3s;
    font-size:15px;
}

#stamina{
    position:absolute;
    left:20px;
    bottom:20px;
    width:220px;
    height:12px;
    border:1px solid white;
}

#staminaFill{
    width:100%;
    height:100%;
    background:white;
}

#flashlight{
    position:absolute;
    right:20px;
    bottom:20px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 14px;
    font-size:14px;
}

#powerInfo{
    position:absolute;
    right:20px;
    top:20px;
    width:270px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.2);
    padding:14px;
    line-height:1.8;
    font-size:14px;
}

#fade{
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:1s;
}
</style>
</head>

<body>

<div id="ui">

    <div id="crosshair">+</div>

    <div id="objective">
        <b>OBJECTIVE</b><br><br>

        電源配分を切り替えながら<br>
        中央ブレーカーを復旧する。<br><br>

        さらに暗闇で動く存在に注意。<br><br>

        ・倉庫へ送電<br>
        ・監視室へ送電<br>
        ・中央ブレーカー起動<br>
        ・管理室へ入る<br><br>

        WASD : 移動<br>
        SHIFT : ダッシュ<br>
        E : 調べる<br>
        F : ライト ON/OFF<br>
        矢印キー : 視点移動
    </div>

    <div id="powerInfo"></div>

    <div id="message"></div>

    <div id="stamina">
        <div id="staminaFill"></div>
    </div>

    <div id="flashlight">
        FLASHLIGHT : OFF
    </div>

    <div id="fade"></div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0x000000,8,45);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,14);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(
    0x404040,
    0.5
);

scene.add(ambient);

const moon = new THREE.DirectionalLight(
    0xaaccff,
    0.45
);

moon.position.set(10,20,10);
moon.castShadow = true;

scene.add(moon);

const flashlight = new THREE.SpotLight(
    0xffffff,
    0
);

flashlight.angle = 0.75;
flashlight.penumbra = 0.7;
flashlight.distance = 55;
flashlight.decay = 1;

scene.add(flashlight);
scene.add(flashlight.target);

let flashlightOn = false;

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({
        color:0x2c2c2c,
        roughness:1
    })
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

const colliders = [];

function createWall(
    x,y,z,w,h,d,color=0x222222
){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    colliders.push(
        new THREE.Box3().setFromObject(mesh)
    );

    return mesh;
}

createWall(0,2,-20,40,4,1);
createWall(-20,2,0,1,4,40);
createWall(20,2,0,1,4,40);
createWall(0,2,20,40,4,1);

createWall(-12,2,-5,10,4,1,0x111111);
createWall(-12,2,-10,10,4,1,0x111111);

createWall(12,2,-5,10,4,1,0x111111);
createWall(12,2,-10,10,4,1,0x111111);

createWall(0,2.5,12,12,5,1,0x181818);
createWall(-6,2.5,8,1,5,8,0x181818);
createWall(6,2.5,8,1,5,8,0x181818);
createWall(0,5,8,12,1,8,0x181818);

const exitSign = new THREE.Mesh(
    new THREE.BoxGeometry(3,0.8,0.2),
    new THREE.MeshBasicMaterial({
        color:0x00ff66
    })
);

exitSign.position.set(0,4.5,4);

scene.add(exitSign);

const door = new THREE.Mesh(
    new THREE.BoxGeometry(3,4,0.3),
    new THREE.MeshStandardMaterial({
        color:0x555555
    })
);

door.position.set(0,2,4);

scene.add(door);

const storageLight = new THREE.PointLight(
    0xffaa66,
    0,
    12
);

storageLight.position.set(-12,4,-7);

scene.add(storageLight);

const cameraLight = new THREE.PointLight(
    0x66aaff,
    0,
    12
);

cameraLight.position.set(12,4,-7);

scene.add(cameraLight);

const hallwayLight = new THREE.PointLight(
    0xffffff,
    0.2,
    20
);

hallwayLight.position.set(0,5,0);

scene.add(hallwayLight);

function createSwitch(x,z,color){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
            color,
            emissive:0x111111
        })
    );

    mesh.position.set(x,1,z);

    scene.add(mesh);

    return mesh;
}

const storageSwitch = createSwitch(
    -15,
    -12,
    0xff4444
);

const cameraSwitch = createSwitch(
    15,
    -12,
    0x4444ff
);

const breakerSwitch = createSwitch(
    0,
    14,
    0x00ffcc
);

const enemy = new THREE.Group();

const enemyBody = new THREE.Mesh(
    new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

enemyBody.position.y = 1.2;

const enemyHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.9,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

enemyHead.position.y = 3;

const enemyEye1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.12),
    new THREE.MeshBasicMaterial({
        color:0xff0000
    })
);

enemyEye1.position.set(-0.2,3,0.8);

const enemyEye2 = enemyEye1.clone();
enemyEye2.position.x = 0.2;

enemy.add(enemyBody);
enemy.add(enemyHead);
enemy.add(enemyEye1);
enemy.add(enemyEye2);

enemy.position.set(0,0,-15);

scene.add(enemy);

const keys = {};

document.addEventListener("keydown",(e)=>{

    keys[e.code] = true;

    if(e.code === "KeyF"){

        flashlightOn = !flashlightOn;

        flashlight.intensity =
            flashlightOn ? 8 : 0;

        document.getElementById(
            "flashlight"
        ).innerHTML =
            "FLASHLIGHT : " +
            (flashlightOn ? "ON" : "OFF");
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.code] = false;
});

let yaw = 0;
let pitch = 0;

let stamina = 100;

const message =
    document.getElementById("message");

function showMessage(text){

    message.innerHTML = text;
    message.style.opacity = 1;

    setTimeout(()=>{
        message.style.opacity = 0;
    },3000);
}

showMessage(
    "暗闇の中で何かが動いている"
);

let activePower = "none";

let storagePowered = false;
let cameraPowered = false;
let breakerPowered = false;

let gameCompleted = false;

function updatePowerUI(){

    document.getElementById(
        "powerInfo"
    ).innerHTML = `
    <b>POWER DISTRIBUTION</b><br><br>

    現在供給中 :
    ${activePower.toUpperCase()}<br><br>

    倉庫 :
    ${storagePowered ? "ONLINE" : "OFFLINE"}<br>

    監視室 :
    ${cameraPowered ? "ONLINE" : "OFFLINE"}<br>

    中央ブレーカー :
    ${breakerPowered ? "ONLINE" : "LOCKED"}
    `;
}

updatePowerUI();

function distance(a,b){

    return a.position.distanceTo(
        b.position
    );
}

function switchPower(target){

    activePower = target;

    storagePowered = false;
    cameraPowered = false;

    storageLight.intensity = 0;
    cameraLight.intensity = 0;

    if(target === "storage"){

        storagePowered = true;

        storageLight.intensity = 2;

        showMessage(
            "倉庫エリアへ送電した"
        );
    }

    if(target === "camera"){

        cameraPowered = true;

        cameraLight.intensity = 2;

        showMessage(
            "監視室へ送電した"
        );
    }

    updatePowerUI();
}

function interact(){

    if(
        distance(camera,storageSwitch) < 2
    ){

        switchPower("storage");
    }

    if(
        distance(camera,cameraSwitch) < 2
    ){

        switchPower("camera");
    }

    if(
        distance(camera,breakerSwitch) < 2 &&
        storagePowered &&
        cameraPowered
    ){

        breakerPowered = true;

        moon.intensity = 0.7;

        breakerSwitch.material.emissive
            .setHex(0x00ffff);

        showMessage(
            "中央ブレーカーを起動した"
        );

        setTimeout(()=>{

            showMessage(
                "管理室の扉が開いた"
            );

            door.position.y = -5;

            gameCompleted = true;

        },3000);

        updatePowerUI();
    }

    if(
        distance(camera,breakerSwitch) < 2 &&
        (!storagePowered || !cameraPowered)
    ){

        showMessage(
            "両方の送電履歴が必要"
        );
    }

    if(
        distance(camera,door) < 4 &&
        gameCompleted
    ){

        document.getElementById(
            "fade"
        ).style.opacity = 1;

        showMessage(
            "CHAPTER 1 CLEAR"
        );
    }
}

document.addEventListener(
    "keydown",
    (e)=>{

        if(e.code === "KeyE"){
            interact();
        }
    }
);

function checkCollision(position){

    const playerBox = new THREE.Box3(
        new THREE.Vector3(
            position.x - 0.4,
            position.y - 1,
            position.z - 0.4
        ),
        new THREE.Vector3(
            position.x + 0.4,
            position.y + 1,
            position.z + 0.4
        )
    );

    for(const box of colliders){

        if(
            playerBox.intersectsBox(box)
        ){
            return true;
        }
    }

    return false;
}

function updateEnemy(delta){

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    const enemyDirection =
        enemy.position.clone()
        .sub(camera.position)
        .normalize();

    const flashlightDot =
        direction.dot(
            enemyDirection
        );

    const enemyDistance =
        enemy.position.distanceTo(
            camera.position
        );

    const flashlightHits =
        flashlightOn &&
        flashlightDot > 0.92 &&
        enemyDistance < 15;

    if(!flashlightHits){

        const moveDir =
            camera.position.clone()
            .sub(enemy.position)
            .normalize();

        enemy.position.add(
            moveDir.multiplyScalar(
                delta * 1.6
            )
        );
    }

    enemy.lookAt(camera.position);

    if(enemyDistance < 1.5){

        document.getElementById(
            "fade"
        ).style.opacity = 1;

        showMessage(
            "GAME OVER"
        );
    }
}

const clock = new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    let moveSpeed = 4;

    if(
        keys["ShiftLeft"] &&
        stamina > 0
    ){

        moveSpeed = 8;

        stamina -= 28 * delta;

    }else{

        stamina += 18 * delta;
    }

    stamina = Math.max(
        0,
        Math.min(100,stamina)
    );

    document.getElementById(
        "staminaFill"
    ).style.width =
        stamina + "%";

    if(keys["ArrowLeft"]){
        yaw += 1.5 * delta;
    }

    if(keys["ArrowRight"]){
        yaw -= 1.5 * delta;
    }

    if(keys["ArrowUp"]){
        pitch += 1.2 * delta;
    }

    if(keys["ArrowDown"]){
        pitch -= 1.2 * delta;
    }

    pitch = Math.max(
        -1.2,
        Math.min(1.2,pitch)
    );

    camera.rotation.order = "YXZ";

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            -forward.z,
            0,
            forward.x
        );

    const oldPosition =
        camera.position.clone();

    if(keys["KeyW"]){

        camera.position.addScaledVector(
            forward,
            moveSpeed * delta
        );
    }

    if(keys["KeyS"]){

        camera.position.addScaledVector(
            forward,
            -moveSpeed * delta
        );
    }

    if(keys["KeyA"]){

        camera.position.addScaledVector(
            right,
            -moveSpeed * delta
        );
    }

    if(keys["KeyD"]){

        camera.position.addScaledVector(
            right,
            moveSpeed * delta
        );
    }

    if(
        checkCollision(
            camera.position
        )
    ){

        camera.position.copy(
            oldPosition
        );
    }

    flashlight.position.copy(
        camera.position
    );

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    flashlight.target.position.copy(
        camera.position.clone().add(
            direction.multiplyScalar(10)
        )
    );

    updateEnemy(delta);

    renderer.render(scene,camera);
}

animate();

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
