<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Poppy Playtime - Cube Monster Edition</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
        
        #viewport {
            perspective: 800px;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        #world {
            position: relative;
            width: 0; height: 0;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        /* 3D構造の共通設定 */
        .cube-base { position: absolute; transform-style: preserve-3d; }
        .face { position: absolute; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; }

        /* 通路 */
        .floor { width: 1000px; height: 3000px; transform: rotateX(90deg) translate(-500px, -1500px) translateZ(-200px); background: repeating-linear-gradient(#222 0 2px, transparent 2px 100px), repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 100px); }

        /* 巨大な青い立方体モンスター (旧ハギー) */
        #monster-cube {
            width: 200px; height: 200px;
            transform: translate3d(-100px, -250px, -1500px);
        }
        .monster-face { width: 200px; height: 200px; background: rgba(0, 50, 200, 0.9); border: 4px solid #00f; display: flex; align-items: center; justify-content: center; font-size: 80px; }

        /* グラブパック立方体 (手前) */
        .hand-cube { position: absolute; width: 80px; height: 80px; transform-style: preserve-3d; bottom: 50px; transition: transform 0.15s ease-out; }
        #cube-l { left: 20%; transform: rotateX(-10deg) rotateY(20deg) translateZ(100px); }
        #cube-r { right: 20%; transform: rotateX(-10deg) rotateY(-20deg) translateZ(100px); }
        .hand-face { width: 80px; height: 80px; opacity: 0.8; border: 2px solid #fff; }

        /* 立方体の面配置用汎用クラス */
        .f-front  { transform: translateZ(var(--z)); }
        .f-back   { transform: rotateY(180deg) translateZ(var(--z)); }
        .f-top    { transform: rotateX(90deg) translateZ(var(--z)); }
        .f-bottom { transform: rotateX(-90deg) translateZ(var(--z)); }
        .f-left   { transform: rotateY(-90deg) translateZ(var(--z)); }
        .f-right  { transform: rotateY(90deg) translateZ(var(--z)); }

        #ui { position: fixed; top: 20px; width: 100%; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <h1>CUBE MONSTER SURVIVAL</h1>
    <p>ROTATE: [←][→] | LAUNCH: [A] (Blue) [D] (Red)</p>
    <h2 id="status" style="color: #0f0;">CORE STABLE</h2>
</div>

<div id="viewport">
    <div id="world">
        <div class="floor"></div>
        
        <!-- モンスター立方体 -->
        <div id="monster-cube" class="cube-base">
            <div class="face monster-face f-front" style="--z: 100px;">👁️👁️</div>
            <div class="face monster-face f-back"  style="--z: 100px;"></div>
            <div class="face monster-face f-top"   style="--z: 100px;"></div>
            <div class="face monster-face f-bottom" style="--z: 100px;"></div>
            <div class="face monster-face f-left"  style="--z: 100px;"></div>
            <div class="face monster-face f-right" style="--z: 100px;"></div>
        </div>
    </div>
</div>

<!-- プレイヤーの手 -->
<div id="cube-l" class="hand-cube">
    <div class="cube-base">
        <div class="face hand-face f-front" style="background:#05f; --z:40px;"></div>
        <div class="face hand-face f-back"  style="background:#05f; --z:40px;"></div>
        <div class="face hand-face f-top"   style="background:#05f; --z:40px;"></div>
        <div class="face hand-face f-bottom" style="background:#05f; --z:40px;"></div>
        <div class="face hand-face f-left"  style="background:#05f; --z:40px;"></div>
        <div class="face hand-face f-right" style="background:#05f; --z:40px;"></div>
    </div>
</div>

<div id="cube-r" class="hand-cube">
    <div class="cube-base">
        <div class="face hand-face f-front" style="background:#f20; --z:40px;"></div>
        <div class="face hand-face f-back"  style="background:#f20; --z:40px;"></div>
        <div class="face hand-face f-top"   style="background:#f20; --z:40px;"></div>
        <div class="face hand-face f-bottom" style="background:#f20; --z:40px;"></div>
        <div class="face hand-face f-left"  style="background:#f20; --z:40px;"></div>
        <div class="face hand-face f-right" style="background:#f20; --z:40px;"></div>
    </div>
</div>

<script>
    const world = document.getElementById('world');
    const monster = document.getElementById('monster-cube');
    const status = document.getElementById('status');
    const cubeL = document.getElementById('cube-l');
    const cubeR = document.getElementById('cube-r');

    let rotY = 0;
    let monsterZ = -1500;
    let gameOver = false;
    const keys = {};

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (!gameOver) {
            if (e.code === 'KeyA') shoot(cubeL, 'L');
            if (e.code === 'KeyD') shoot(cubeR, 'R');
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function shoot(cube, side) {
        const original = cube.style.transform;
        cube.style.transform += " translateZ(-1000px) rotateX(360deg)";
        
        setTimeout(() => {
            // モンスターが正面にいるときに撃てばノックバック
            // モンスターは中央付近にいるので、視点が中央（rotY=0付近）ならヒット
            if (Math.abs(rotY) < 15) {
                monsterZ -= 300;
                status.innerText = "CRITICAL REJECTION";
                status.style.color = "#fff";
                setTimeout(() => { status.innerText = "CORE STABLE"; status.style.color = "#0f0"; }, 500);
            }
            setTimeout(() => { cube.style.transform = original; }, 200);
        }, 150);
    }

    function update() {
        if (gameOver) return;

        if (keys['ArrowLeft']) rotY += 2;
        if (keys['ArrowRight']) rotY -= 2;
        rotY = Math.max(Math.min(rotY, 50), -50);
        world.style.transform = `rotateY(${rotY}deg)`;

        monsterZ += 4;
        monster.style.transform = `translate3d(-100px, -250px, ${monsterZ}px)`;

        if (monsterZ > -300) {
            gameOver = true;
            status.innerText = "CONNECTION LOST - CUBE BREACH";
            status.style.color = "red";
            document.body.style.backgroundColor = "#200";
        }

        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
