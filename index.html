<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Poppy Playtime - Cube Pack Edition</title>
    <style>
        body { margin: 0; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        #game-view { 
            position: relative; width: 800px; height: 500px; margin: 50px auto; 
            border: 8px solid #333; overflow: hidden; background: #0a0a0a;
            perspective: 1000px; /* 3D効果用 */
        }
        
        #stage {
            position: absolute; width: 2000px; height: 100%; left: -600px;
            transition: left 0.1s linear;
        }

        /* ターゲット */
        .target { 
            position: absolute; width: 100px; height: 100px; top: 180px;
            border: 5px solid; display: flex; align-items: center; justify-content: center;
            font-weight: bold; background: rgba(255,255,255,0.1);
        }
        #target-l { left: 450px; border-color: #00aaff; color: #00aaff; }
        #target-r { left: 1450px; border-color: #ff4400; color: #ff4400; }
        .active { background: #fff !important; transform: scale(1.1); }

        #huggy { position: absolute; left: 950px; bottom: 100px; font-size: 100px; transition: transform 0.1s; }

        /* 立方体（GrabPack）のスタイル */
        .cube-container {
            position: absolute; bottom: -20px; width: 60px; height: 60px;
            transform-style: preserve-3d; transition: transform 0.2s ease-out;
            z-index: 100;
        }
        #cube-l { left: 150px; transform: translateY(200px) rotateX(20deg) rotateY(20deg); }
        #cube-r { right: 150px; transform: translateY(200px) rotateX(20deg) rotateY(-20deg); }

        .cube {
            position: relative; width: 60px; height: 60px; transform-style: preserve-3d;
        }
        .face {
            position: absolute; width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.5);
            line-height: 60px; text-align: center; font-size: 30px;
        }
        /* 面の配置 */
        .front  { transform: translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        .blue-cube .face { background: rgba(0, 100, 255, 0.8); }
        .red-cube .face { background: rgba(255, 50, 0, 0.8); }

        #ui { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div id="ui">
    <h2>CUBE-PACK SYSTEM</h2>
    <p>Move: <kbd>←</kbd> <kbd>→</kbd> | Launch: <kbd>A</kbd> (Blue) <kbd>D</kbd> (Red)</p>
    <h3 id="status">READY</h3>
</div>

<div id="game-view">
    <div id="stage">
        <div id="target-l" class="target">BLUE</div>
        <div id="target-r" class="target">RED</div>
        <div id="huggy">👹</div>
    </div>
    
    <!-- 青い立方体 -->
    <div id="cube-l" class="cube-container blue-cube">
        <div class="cube">
            <div class="face front">■</div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>

    <!-- 赤い立方体 -->
    <div id="cube-r" class="cube-container red-cube">
        <div class="cube">
            <div class="face front">■</div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </div>
</div>

<script>
    const stage = document.getElementById('stage');
    const huggy = document.getElementById('huggy');
    const statusText = document.getElementById('status');
    const cubeL = document.getElementById('cube-l');
    const cubeR = document.getElementById('cube-r');

    let cameraX = -600;
    let huggyScale = 1;
    let gameOver = false;
    const keys = {};

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (gameOver) return;
        if (e.code === 'KeyA') launchCube(cubeL, 'L');
        if (e.code === 'KeyD') launchCube(cubeR, 'R');
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function launchCube(cube, side) {
        // 発射アニメーション（回転しながら飛ぶ）
        cube.style.transform = `translateY(-350px) rotateX(360deg) rotateY(360deg)`;
        
        setTimeout(() => {
            const targetPos = (side === 'L') ? (450 + cameraX) : (1450 + cameraX);
            const target = document.getElementById(side === 'L' ? 'target-l' : 'target-r');

            if (targetPos > 300 && targetPos < 500) {
                target.classList.add('active');
                huggyScale = Math.max(1, huggyScale - 0.5);
                statusText.innerText = "HIT!";
                setTimeout(() => target.classList.remove('active'), 200);
            }

            // 戻る
            setTimeout(() => {
                cube.style.transform = side === 'L' 
                    ? "translateY(200px) rotateX(20deg) rotateY(20deg)" 
                    : "translateY(200px) rotateX(20deg) rotateY(-20deg)";
            }, 200);
        }, 200);
    }

    function update() {
        if (gameOver) return;
        if (keys['ArrowLeft']) cameraX += 10;
        if (keys['ArrowRight']) cameraX -= 10;
        cameraX = Math.min(Math.max(cameraX, -1200), 0);
        stage.style.left = cameraX + "px";

        huggyScale += 0.005;
        huggy.style.transform = `scale(${huggyScale})`;

        if (huggyScale > 5) {
            gameOver = true;
            statusText.innerText = "GAME OVER";
            huggy.innerHTML = "💀";
        }
        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
