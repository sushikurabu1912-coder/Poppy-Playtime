<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Cyber City Trial - Mobile Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* スマホのデフォルトスクロールやズームを無効化 */
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            background-color: #121224;
            box-sizing: border-box;
        }
        #ui {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }
        /* スマホ用タッチUIの配置 */
        .touch-control {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            z-index: 5;
            user-select: none;
        }
        #joystick-base {
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            background: rgba(0, 110, 255, 0.3);
            border: 2px solid #00ffff;
        }
        #joystick-stick {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00ffff;
            border-radius: 50%;
        }
        #action-button {
            bottom: 30px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 85, 0.4);
            border: 2px solid #ff0055;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 12px;
            box-shadow: 0 0 10px #ff0055;
        }
        #action-button:active {
            background: rgba(255, 0, 85, 0.8);
        }
    </style>
</head>
<body>

    <h1 style="color: #00ffcc; margin: 5px 0; font-size: 20px;">CYBER TRIAL (TOUCH)</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- バーチャルジョスティック (左側) -->
        <div id="joystick-base" class="touch-control">
            <div id="joystick-stick"></div>
        </div>
        
        <!-- スキルボタン (右側) -->
        <div id="action-button" class="touch-control">WAVE</div>
    </div>
    
    <div id="ui">
        <span id="stats" style="color: #ff00ff;">SPEED: 0 | POWER: 0 | WAVE CD: READY</span>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const statsUi = document.getElementById("stats");

// キー入力の状態管理（PC用）
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// タッチ操作（ジョイスティック）の状態管理
const joystick = {
    base: document.getElementById("joystick-base"),
    stick: document.getElementById("joystick-stick"),
    active: false,
    startX: 0,
    startY: 0,
    dirX: 0, // -1 から 1 の値
    dirY: 0  // -1 から 1 の値
};

// プレイヤーオブジェクト
const player = {
    x: 400,
    y: 300,
    radius: 15,
    baseSpeed: 4,
    speedItemCount: 0,
    powerItemCount: 0,
    waveCooldown: 0,
    waveActive: false,
    waveRadius: 0,
    maxWaveRadius: 100,
    triggerWave: false // スマホとPC共通のトリガー
};

// アイテム（コンテナ）
let items = [];
const ITEM_TYPES = ["SPEED", "POWER"];

function spawnItem() {
    items.push({
        x: Math.random() * (canvas.width - 40),
        y: Math.random() * (canvas.height - 40),
        size: 20,
        type: ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)]
    });
}

for (let i = 0; i < 10; i++) spawnItem();

// --- 📱 スマホタッチイベントの実装 ---

// ジョイスティックの処理
joystick.base.addEventListener("touchstart", e => {
    joystick.active = true;
    const touch = e.touches[0];
    const rect = joystick.base.getBoundingClientRect();
    // ベースの中心座標を記憶
    joystick.startX = rect.left + rect.width / 2;
    joystick.startY = rect.top + rect.height / 2;
});

window.addEventListener("touchmove", e => {
    if (!joystick.active) return;
    
    // ジョイスティックに触れている指を特定
    let touch = null;
    for (let t of e.touches) {
        if (t.clientX < window.innerWidth / 2) { // 画面左側のタッチをジョイスティックとみなす
            touch = t;
            break;
        }
    }
    if (!touch) return;

    // 中心からの距離を計算
    let dx = touch.clientX - joystick.startX;
    let dy = touch.clientY - joystick.startY;
    let distance = Math.sqrt(dx * dx + dy * dy);
    const maxRadius = 40; // スティックの可動範囲

    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
        distance = maxRadius;
    }

    // スティックの視覚的移動 (初期位置のトップ30px, レフト30pxからの差分)
    joystick.stick.style.transform = `translate(${dx}px, ${dy}px)`;

    // 移動方向の割合を-1〜1で抽出
    joystick.dirX = dx / maxRadius;
    joystick.dirY = dy / maxRadius;
}, { passive: false });

window.addEventListener("touchend", e => {
    // 左側のタッチがなくなったらジョイスティックをリセット
    let leftTouchActive = false;
    for (let t of e.touches) {
        if (t.clientX < window.innerWidth / 2) leftTouchActive = true;
    }
    
    if (!leftTouchActive) {
        joystick.active = false;
        joystick.stick.style.transform = `translate(0px, 0px)`;
        joystick.dirX = 0;
        joystick.dirY = 0;
    }
});

// WAVEボタンの処理
const actionButton = document.getElementById("action-button");
actionButton.addEventListener("touchstart", e => {
    e.preventDefault(); // 連打時のブラウザズーム対策
    player.triggerWave = true;
});

// 当たり判定チェック（円と四角）
function checkCollision(circle, rect) {
    let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.size));
    let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.size));
    let distanceX = circle.x - closestX;
    let distanceY = circle.y - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (circle.radius * circle.radius);
}

// メインループ
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    // --- 1. 移動処理 (PC/スマホ両対応) ---
    let currentSpeed = player.baseSpeed + (player.speedItemCount * 0.5);
    let dx = 0;
    let dy = 0;

    // PCキーボード入力
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= 1;
    if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    // スマホジョイスティック入力がある場合は上書き
    if (joystick.active) {
        dx = joystick.dirX;
        dy = joystick.dirY;
    }

    player.x += dx * currentSpeed;
    player.y += dy * currentSpeed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // --- 2. スキル（ウェーブ）処理 ---
    if (keys[" "] || keys["Spacebar"]) {
        player.triggerWave = true;
    }

    if (player.triggerWave && player.waveCooldown === 0 && !player.waveActive) {
        player.waveActive = true;
        player.waveRadius = player.radius;
        player.waveCooldown = 120; 
    }
    player.triggerWave = false; // トリガーリセット

    if (player.waveActive) {
        player.waveRadius += 4 + (player.powerItemCount * 0.5);
        if (player.waveRadius >= player.maxWaveRadius + (player.powerItemCount * 10)) {
            player.waveActive = false;
        }
    }

    if (player.waveCooldown > 0) player.waveCooldown--;

    // --- 3. アイテム回収 ---
    for (let i = items.length - 1; i >= 0; i--) {
        if (checkCollision(player, items[i])) {
            if (items[i].type === "SPEED") player.speedItemCount++;
            else if (items[i].type === "POWER") player.powerItemCount++;
            items.splice(i, 1);
            spawnItem();
        }
    }

    // --- 4. UI更新 ---
    let cdText = player.waveCooldown > 0 ? `RECHARGING (${Math.ceil(player.waveCooldown/60)}s)` : "READY";
    statsUi.innerHTML = `SPEED: +${player.speedItemCount} | POWER: +${player.powerItemCount} | WAVE: <span style="color: #00ffcc;">${cdText}</span>`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景グリッド
    ctx.strokeStyle = "#1f1f3a";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // アイテム
    items.forEach(item => {
        ctx.fillStyle = item.type === "SPEED" ? "#00ffff" : "#ff0055";
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(item.x, item.y, item.size, item.size);
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 0;
        ctx.font = "10px sans-serif";
        ctx.fillText(item.type[0], item.x + 6, item.y + 14);
    });

    // ウェーブ
    if (player.waveActive) {
        ctx.strokeStyle = "rgba(0, 255, 204, 0.5)";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ffcc";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.waveRadius, 0, Math.PI * 2);
        ctx.stroke();
    }

    // プレイヤー
    ctx.fillStyle = "#00ff55";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00ff55";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 4, 0, Math.PI * 2);
    ctx.fill();
}

gameLoop();
</script>

</body>
</html>
