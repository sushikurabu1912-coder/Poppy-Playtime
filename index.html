<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Horror - Fix View</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 10px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <b>MISSION:</b> <span id="task">ヒューズを3つ集めろ</span><br>
        FUSES: <span id="fuse-count">0</span> / 3
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        // 背景を少し明るいグレーにして、何も映らないのを防ぐ
        scene.background = new THREE.Color(0x222222); 
        scene.fog = new THREE.Fog(0x222222, 1, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 【重要】開始位置を少し後ろに下げ、壁の中に埋まらないようにする
        camera.position.set(0, 1.6, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 【重要】環境光を強くする（懐中電灯がなくてもうっすら見えるように）
        const ambient = new THREE.AmbientLight(0xffffff, 0.4); 
        scene.add(ambient);

        const flashlight = new THREE.SpotLight(0xffffff, 100, 40, Math.PI/4, 0.5);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // 地面
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100), 
            new THREE.MeshStandardMaterial({ color: 0x444444 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        scene.add(new THREE.GridHelper(100, 50, 0x888888, 0x444444));

        // 障害物（テスト用）
        const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xff0000}));
        box.position.set(0, 1, -5);
        scene.add(box);

        // 操作
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            
            if(keys['KeyW']) camera.translateZ(-0.1);
            if(keys['KeyS']) camera.translateZ(0.1);
            if(keys['KeyA']) camera.translateX(-0.1);
            if(keys['KeyD']) camera.translateX(0.1);
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.03;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.03;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
