<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Horror Factory</title>

<style>
    body{
        margin:0;
        overflow:hidden;
        background:black;
        font-family:sans-serif;
    }

    #ui{
        position:absolute;
        top:10px;
        left:10px;
        color:white;
        z-index:10;
        background:rgba(0,0,0,0.5);
        padding:10px;
        border-radius:10px;
        line-height:1.6;
    }

    #message{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:white;
        font-size:60px;
        display:none;
        z-index:20;
    }
</style>
</head>
<body>

<div id="ui">
    WASD = 移動<br>
    矢印キー = 視点変更<br>
    バッテリーを3つ集めて脱出！
</div>

<div id="message"></div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

/////////////////////////
// シーン
/////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x000000, 10, 100);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////
// ライト
/////////////////////////

const ambient = new THREE.AmbientLight(0x404040, 1);
scene.add(ambient);

const flashlight = new THREE.SpotLight(0xffffff, 5);

flashlight.angle = 0.5;
flashlight.penumbra = 0.5;
flashlight.distance = 70;

scene.add(flashlight);
scene.add(flashlight.target);

/////////////////////////
// 床
/////////////////////////

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({
        color:0x222222
    })
);

floor.rotation.x = -Math.PI/2;
scene.add(floor);

/////////////////////////
// 壁
/////////////////////////

function wall(x,y,z,w,h,d,color=0x444444){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:color
        })
    );

    mesh.position.set(x,y,z);

    scene.add(mesh);
}

wall(0,5,-80,160,10,2);
wall(-80,5,0,2,10,160);
wall(80,5,0,2,10,160);

wall(0,5,80,160,10,2);

wall(-30,5,-20,2,10,40);
wall(20,5,-40,40,10,2);
wall(40,5,10,2,10,50);

/////////////////////////
// プレイヤー
/////////////////////////

camera.position.set(0,2,20);

/////////////////////////
// 視点回転
/////////////////////////

let yaw = 0;
let pitch = 0;

/////////////////////////
// キー入力
/////////////////////////

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

/////////////////////////
// バッテリー
/////////////////////////

const batteries = [];
let collected = 0;

function createBattery(x,z){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
            color:0xffff00,
            emissive:0xffff00,
            emissiveIntensity:1
        })
    );

    mesh.position.set(x,1,z);

    scene.add(mesh);

    batteries.push(mesh);
}

createBattery(-20,-20);
createBattery(30,-50);
createBattery(-40,40);

/////////////////////////
// モンスター
/////////////////////////

const monster = new THREE.Mesh(
    new THREE.BoxGeometry(4,6,4),
    new THREE.MeshStandardMaterial({
        color:0x0066ff,
        emissive:0x0033ff,
        emissiveIntensity:1
    })
);

monster.position.set(0,3,-60);

scene.add(monster);

/////////////////////////
// ドア
/////////////////////////

const door = new THREE.Mesh(
    new THREE.BoxGeometry(8,10,1),
    new THREE.MeshStandardMaterial({
        color:0x888888
    })
);

door.position.set(0,5,-75);

scene.add(door);

/////////////////////////
// ゲーム状態
/////////////////////////

let gameOver = false;

const message = document.getElementById("message");

function endGame(text){

    gameOver = true;

    message.style.display = "block";
    message.innerHTML = text;
}

/////////////////////////
// カメラ回転
/////////////////////////

function updateCameraRotation(){

    const rotateSpeed = 0.03;

    if(keys["arrowleft"]){
        yaw += rotateSpeed;
    }

    if(keys["arrowright"]){
        yaw -= rotateSpeed;
    }

    if(keys["arrowup"]){
        pitch += rotateSpeed;
    }

    if(keys["arrowdown"]){
        pitch -= rotateSpeed;
    }

    pitch = Math.max(-1.2, Math.min(1.2, pitch));

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
}

/////////////////////////
// プレイヤー移動
/////////////////////////

function updateMovement(){

    const speed = 0.2;

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);

    forward.y = 0;
    forward.normalize();

    const right = new THREE.Vector3();
    right.crossVectors(forward, new THREE.Vector3(0,1,0));

    if(keys["w"]){
        camera.position.add(
            forward.clone().multiplyScalar(speed)
        );
    }

    if(keys["s"]){
        camera.position.add(
            forward.clone().multiplyScalar(-speed)
        );
    }

    if(keys["a"]){
        camera.position.add(
            right.clone().multiplyScalar(speed)
        );
    }

    if(keys["d"]){
        camera.position.add(
            right.clone().multiplyScalar(-speed)
        );
    }
}

/////////////////////////
// 懐中電灯
/////////////////////////

function updateFlashlight(){

    flashlight.position.copy(camera.position);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    flashlight.target.position.copy(
        camera.position.clone().add(dir)
    );
}

/////////////////////////
// バッテリー取得
/////////////////////////

function updateBatteries(){

    batteries.forEach(b=>{

        if(!b.visible) return;

        b.rotation.y += 0.03;

        const dist = camera.position.distanceTo(b.position);

        if(dist < 2){

            b.visible = false;

            collected++;

            console.log("Collected:", collected);
        }
    });
}

/////////////////////////
// モンスターAI
/////////////////////////

function updateMonster(){

    const dir = new THREE.Vector3()
        .subVectors(camera.position, monster.position)
        .normalize();

    monster.position.add(
        dir.multiplyScalar(0.04)
    );

    monster.lookAt(camera.position);

    const dist = camera.position.distanceTo(monster.position);

    if(dist < 3){

        endGame("GAME OVER");
    }
}

/////////////////////////
// 脱出判定
/////////////////////////

function updateDoor(){

    if(collected < 3) return;

    const dist = camera.position.distanceTo(door.position);

    if(dist < 6){

        endGame("YOU ESCAPED!");
    }
}

/////////////////////////
// アニメーション
/////////////////////////

function animate(){

    requestAnimationFrame(animate);

    if(!gameOver){

        updateCameraRotation();

        updateMovement();

        updateFlashlight();

        updateBatteries();

        updateMonster();

        updateDoor();
    }

    renderer.render(scene, camera);
}

animate();

/////////////////////////
// リサイズ
/////////////////////////

window.addEventListener("resize", ()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
