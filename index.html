<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Poppy Style Horror Game</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: sans-serif;
    }

    body{
        background:#111;
        color:white;
        overflow:hidden;
    }

    #game{
        width:100vw;
        height:100vh;
        position:relative;
        background:
            linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
            url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop');
        background-size:cover;
        background-position:center;
    }

    #player{
        width:40px;
        height:40px;
        border-radius:50%;
        background:#00ffcc;
        position:absolute;
        left:80px;
        top:80px;
        box-shadow:0 0 20px #00ffcc;
        z-index:5;
    }

    #monster{
        width:60px;
        height:60px;
        background:#0066ff;
        border-radius:10px;
        position:absolute;
        right:100px;
        bottom:100px;
        box-shadow:0 0 25px #0066ff;
        transition:0.08s linear;
    }

    .battery{
        width:30px;
        height:30px;
        background:yellow;
        position:absolute;
        border-radius:5px;
        box-shadow:0 0 15px yellow;
    }

    #door{
        width:100px;
        height:160px;
        background:#444;
        border:5px solid #888;
        position:absolute;
        right:50px;
        top:50%;
        transform:translateY(-50%);
    }

    #ui{
        position:absolute;
        top:10px;
        left:10px;
        z-index:10;
        background:rgba(0,0,0,.5);
        padding:10px;
        border-radius:10px;
    }

    #message{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        font-size:48px;
        display:none;
        z-index:20;
        text-align:center;
    }

    #instructions{
        position:absolute;
        bottom:10px;
        left:10px;
        background:rgba(0,0,0,.6);
        padding:10px;
        border-radius:10px;
        z-index:10;
    }
</style>
</head>
<body>

<div id="game">

    <div id="player"></div>
    <div id="monster"></div>
    <div id="door"></div>

    <div class="battery" style="left:300px; top:200px;"></div>
    <div class="battery" style="left:600px; top:500px;"></div>
    <div class="battery" style="left:900px; top:150px;"></div>

    <div id="ui">
        バッテリー: <span id="count">0</span>/3
    </div>

    <div id="instructions">
        WASD または 矢印キーで移動<br>
        バッテリーを3個集めて出口へ！
    </div>

    <div id="message"></div>

</div>

<script>
const player = document.getElementById("player");
const monster = document.getElementById("monster");
const batteries = document.querySelectorAll(".battery");
const countText = document.getElementById("count");
const message = document.getElementById("message");
const door = document.getElementById("door");

let px = 80;
let py = 80;

let mx = window.innerWidth - 160;
let my = window.innerHeight - 160;

let collected = 0;
let gameOver = false;

const speed = 6;
const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

function updatePlayer(){

    if(gameOver) return;

    if(keys["w"] || keys["arrowup"]) py -= speed;
    if(keys["s"] || keys["arrowdown"]) py += speed;
    if(keys["a"] || keys["arrowleft"]) px -= speed;
    if(keys["d"] || keys["arrowright"]) px += speed;

    px = Math.max(0, Math.min(window.innerWidth - 40, px));
    py = Math.max(0, Math.min(window.innerHeight - 40, py));

    player.style.left = px + "px";
    player.style.top = py + "px";
}

function updateMonster(){

    if(gameOver) return;

    const dx = px - mx;
    const dy = py - my;

    const dist = Math.sqrt(dx*dx + dy*dy);

    mx += dx / dist * 2;
    my += dy / dist * 2;

    monster.style.left = mx + "px";
    monster.style.top = my + "px";

    // 捕まる
    if(dist < 50){
        endGame("GAME OVER");
    }
}

function checkBatteries(){

    batteries.forEach(b => {

        if(b.style.display === "none") return;

        const bx = b.offsetLeft;
        const by = b.offsetTop;

        const dist = Math.hypot(px - bx, py - by);

        if(dist < 40){
            b.style.display = "none";
            collected++;
            countText.textContent = collected;
        }
    });
}

function checkDoor(){

    if(collected < 3) return;

    const dx = px - door.offsetLeft;
    const dy = py - door.offsetTop;

    const dist = Math.hypot(dx, dy);

    if(dist < 100){
        endGame("YOU ESCAPED!");
    }
}

function endGame(text){
    gameOver = true;
    message.style.display = "block";
    message.innerHTML = text;
}

function gameLoop(){
    updatePlayer();
    updateMonster();
    checkBatteries();
    checkDoor();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
