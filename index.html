<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Horror Factory</title>

<style>
    body{
        margin:0;
        overflow:hidden;
        background:black;
        font-family:sans-serif;
    }

    #ui{
        position:absolute;
        top:10px;
        left:10px;
        color:white;
        z-index:10;
        background:rgba(0,0,0,0.5);
        padding:10px;
        border-radius:10px;
    }

    #message{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:white;
        font-size:60px;
        display:none;
        z-index:20;
    }
</style>
</head>
<body>

<div id="ui">
    WASDで移動<br>
    マウスで視点操作<br>
    バッテリーを3つ集めろ
</div>

<div id="message"></div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x000000, 10, 80);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////
// ライト
/////////////////////////

const ambient = new THREE.AmbientLight(0x404040, 1);
scene.add(ambient);

const flashlight = new THREE.SpotLight(0xffffff, 5);
flashlight.angle = 0.4;
flashlight.penumbra = 0.5;
flashlight.distance = 60;

scene.add(flashlight);
scene.add(flashlight.target);

/////////////////////////
// 操作
/////////////////////////

const controls = new PointerLockControls(camera, document.body);

document.body.addEventListener('click', ()=>{
    controls.lock();
});

/////////////////////////
// 床
/////////////////////////

const floorGeo = new THREE.PlaneGeometry(200,200);
const floorMat = new THREE.MeshStandardMaterial({
    color:0x222222
});

const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/////////////////////////
// 壁
/////////////////////////

function wall(x,y,z,w,h,d){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:0x444444
        })
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);
}

wall(0,5,-30,60,10,2);
wall(-30,5,0,2,10,60);
wall(30,5,0,2,10,60);

/////////////////////////
// プレイヤー
/////////////////////////

camera.position.set(0,2,10);

/////////////////////////
// バッテリー
/////////////////////////

const batteries = [];

function createBattery(x,z){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
            color:0xffff00,
            emissive:0xffff00,
            emissiveIntensity:1
        })
    );

    mesh.position.set(x,1,z);

    scene.add(mesh);
    batteries.push(mesh);
}

createBattery(-10,-10);
createBattery(10,-20);
createBattery(0,-40);

/////////////////////////
// モンスター
/////////////////////////

const monster = new THREE.Mesh(
    new THREE.BoxGeometry(4,6,4),
    new THREE.MeshStandardMaterial({
        color:0x0066ff,
        emissive:0x0033ff,
        emissiveIntensity:1
    })
);

monster.position.set(0,3,-50);
scene.add(monster);

/////////////////////////
// ドア
/////////////////////////

const door = new THREE.Mesh(
    new THREE.BoxGeometry(6,10,1),
    new THREE.MeshStandardMaterial({
        color:0x888888
    })
);

door.position.set(0,5,-70);
scene.add(door);

/////////////////////////
// 移動
/////////////////////////

const keys = {};
let collected = 0;
let gameOver = false;

document.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener('keyup', e=>{
    keys[e.key.toLowerCase()] = false;
});

/////////////////////////
// UI
/////////////////////////

const msg = document.getElementById("message");

function endGame(text){

    gameOver = true;
    msg.style.display = "block";
    msg.innerHTML = text;
}

/////////////////////////
// アニメーション
/////////////////////////

function animate(){

    requestAnimationFrame(animate);

    if(!gameOver){

        const speed = 0.15;

        if(keys["w"]) controls.moveForward(speed);
        if(keys["s"]) controls.moveForward(-speed);
        if(keys["a"]) controls.moveRight(-speed);
        if(keys["d"]) controls.moveRight(speed);

        /////////////////////////
        // 懐中電灯
        /////////////////////////

        flashlight.position.copy(camera.position);

        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);

        flashlight.target.position.copy(
            camera.position.clone().add(dir)
        );

        /////////////////////////
        // バッテリー取得
        /////////////////////////

        batteries.forEach((b,i)=>{

            if(!b.visible) return;

            const dist = camera.position.distanceTo(b.position);

            b.rotation.y += 0.03;

            if(dist < 2){

                b.visible = false;
                collected++;

                console.log("Battery:", collected);
            }
        });

        /////////////////////////
        // モンスター追跡
        /////////////////////////

        const direction = new THREE.Vector3()
            .subVectors(camera.position, monster.position)
            .normalize();

        monster.position.add(direction.multiplyScalar(0.03));

        monster.lookAt(camera.position);

        const mdist = camera.position.distanceTo(monster.position);

        if(mdist < 3){

            endGame("GAME OVER");
        }

        /////////////////////////
        // 脱出
        /////////////////////////

        if(collected >= 3){

            const ddist = camera.position.distanceTo(door.position);

            if(ddist < 5){

                endGame("YOU ESCAPED!");
            }
        }
    }

    renderer.render(scene, camera);
}

animate();

/////////////////////////
// リサイズ
/////////////////////////

window.addEventListener('resize', ()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
