<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Horror - Mission Protocol</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px;
            border-left: 5px solid #00ffff; pointer-events: none;
        }
        #center-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 2em; text-align: center; pointer-events: none;
            text-shadow: 0 0 15px #f00; opacity: 0; transition: opacity 0.5s;
        }
        .key-hint { color: #888; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 0.8em; color: #00ffff;">SYSTEM: ACTIVE</div>
        <div id="task" style="font-size: 1.2em; margin: 5px 0;">コアを3つ回収せよ</div>
        <div style="font-size: 1.1em;">CORES: <span id="fuse-count">0</span> / 3</div>
        <div class="key-hint">[W,A,S,D] 移動 / [F] ライト切替 / [J,L] 視点</div>
    </div>
    <div id="center-msg"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.Fog(0x020202, 1, 35);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 15); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライト系 ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.05); // 最小限の明るさ
        scene.add(ambient);

        const flashlight = new THREE.SpotLight(0xffffff, 180, 40, Math.PI / 5, 0.3);
        flashlight.castShadow = true;
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- 地面 ---
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 壁（隙間なく配置） ---
        const walls = [];
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const createWall = (w, h, d, x, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            m.position.set(x, h/2, z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
            walls.push(m);
        };

        // スタート地点を囲むように配置（隙間を埋めるため厚めに設定）
        createWall(30, 5, 2, 0, 20);   // 背後
        createWall(2, 5, 40, -15, 0);  // 左
        createWall(2, 5, 40, 15, 0);   // 右
        createWall(10, 5, 2, -10, 0);  // 前面左
        createWall(10, 5, 2, 10, 0);   // 前面右

        // --- コア (Cores) ---
        const cores = [];
        const corePos = [{x:-10, z:-10}, {x:10, z:-15}, {x:0, z:-30}];
        corePos.forEach(p => {
            const f = new THREE.Mesh(
                new THREE.IcosahedronGeometry(0.4, 0),
                new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 })
            );
            f.position.set(p.x, 0.8, p.z);
            scene.add(f);
            cores.push(f);
        });

        // --- 操作 ---
        const keys = {};
        let collected = 0;
        let isLightOn = true;

        const showMsg = (txt) => {
            const el = document.getElementById('center-msg');
            el.innerText = txt; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        };

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'KeyF') {
                isLightOn = !isLightOn;
                flashlight.intensity = isLightOn ? 180 : 0;
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            const prevPos = camera.position.clone();
            const speed = 0.12;

            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);
            
            if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
            if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

            camera.position.y = 1.6;

            // 当たり判定
            const playerBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(0.8, 2, 0.8));
            for(let wall of walls) {
                if(playerBox.intersectsBox(new THREE.Box3().setFromObject(wall))) {
                    camera.position.copy(prevPos);
                    break;
                }
            }

            // アイテム回収
            cores.forEach(c => {
                c.rotation.y += 0.02; // 回転演出
                if(c.visible && camera.position.distanceTo(c.position) < 1.5) {
                    c.visible = false;
                    collected++;
                    document.getElementById('fuse-count').innerText = collected;
                    if(collected < 3) showMsg("コアを回収");
                    else {
                        showMsg("全コア回収完了。脱出せよ。");
                        document.getElementById('task').innerText = "脱出ポイントへ向かえ";
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
