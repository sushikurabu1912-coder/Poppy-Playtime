<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ROOFTOP HORROR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:20px;
    opacity:0.8;
}

#objective{
    position:absolute;
    top:20px;
    left:20px;
    width:420px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.2);
    padding:16px;
    line-height:1.8;
    font-size:14px;
}

#message{
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    padding:12px 20px;
    opacity:0;
    transition:0.3s;
    font-size:15px;
}

#stamina{
    position:absolute;
    left:20px;
    bottom:20px;
    width:220px;
    height:12px;
    border:1px solid white;
}

#staminaFill{
    width:100%;
    height:100%;
    background:white;
}

#flashlight{
    position:absolute;
    right:20px;
    bottom:20px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 14px;
    font-size:14px;
}

#fade{
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:1s;
}
</style>
</head>

<body>

<div id="ui">

    <div id="crosshair">+</div>

    <div id="objective">
        <b>OBJECTIVE</b><br><br>

        管理室に入るために<br>
        「3つの電源スイッチ」を起動する。<br><br>

        ① メリーゴーランド電源<br>
        ② ゲームコーナー電源<br>
        ③ 中央ブレーカー<br><br>

        最後に管理室へ向かう。<br><br>

        WASD : 移動<br>
        SHIFT : ダッシュ<br>
        E : 調べる<br>
        F : ライト ON/OFF<br>
        矢印キー : 視点移動
    </div>

    <div id="message"></div>

    <div id="stamina">
        <div id="staminaFill"></div>
    </div>

    <div id="flashlight">
        FLASHLIGHT : OFF
    </div>

    <div id="fade"></div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0x000000,8,45);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,12);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0x404040,0.5);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0xaaccff,0.45);
moon.position.set(10,20,10);
moon.castShadow = true;
scene.add(moon);

const flashlight = new THREE.SpotLight(
    0xffffff,
    0
);

flashlight.angle = 0.75;
flashlight.penumbra = 0.7;
flashlight.distance = 55;
flashlight.decay = 1;
flashlight.castShadow = true;

scene.add(flashlight);
scene.add(flashlight.target);

let flashlightOn = false;

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({
        color:0x2c2c2c,
        roughness:1
    })
);

floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const colliders = [];

function createWall(x,y,z,w,h,d,color=0x222222){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    const box = new THREE.Box3().setFromObject(mesh);

    colliders.push(box);

    return mesh;
}

createWall(0,2,-20,40,4,1);
createWall(-20,2,0,1,4,40);
createWall(20,2,0,1,4,40);
createWall(0,2,20,40,4,1);

createWall(-11,2,-4,8,4,8,0x181818);
createWall(11,2,-5,8,4,8,0x181818);
createWall(0,2,8,12,4,6,0x181818);

function createLamp(x,z){

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1,0.1,5),
        new THREE.MeshStandardMaterial({
            color:0x333333
        })
    );

    pole.position.set(x,2.5,z);

    scene.add(pole);

    const light = new THREE.PointLight(
        0xffaa66,
        0.5,
        6
    );

    light.position.set(x,4.5,z);

    scene.add(light);
}

createLamp(-8,-8);
createLamp(8,-8);
createLamp(0,8);

const carousel = new THREE.Group();

const base = new THREE.Mesh(
    new THREE.CylinderGeometry(5,5,1,32),
    new THREE.MeshStandardMaterial({
        color:0x551111,
        emissive:0x110000
    })
);

carousel.add(base);

const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.3,6),
    new THREE.MeshStandardMaterial({
        color:0x888888
    })
);

pole.position.y = 3;

carousel.add(pole);

for(let i=0;i<6;i++){

    const horse = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,2),
        new THREE.MeshStandardMaterial({
            color:0x666666
        })
    );

    const angle = (Math.PI*2/6)*i;

    horse.position.set(
        Math.cos(angle)*3,
        2,
        Math.sin(angle)*3
    );

    carousel.add(horse);
}

carousel.position.set(0,0,-8);

scene.add(carousel);

const panda = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

body.position.y = 1.2;

const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.9,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

head.position.y = 3;

const eye1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.12),
    new THREE.MeshBasicMaterial({
        color:0xff0000
    })
);

eye1.position.set(-0.2,3,0.8);

const eye2 = eye1.clone();
eye2.position.x = 0.2;

panda.add(body);
panda.add(head);
panda.add(eye1);
panda.add(eye2);

panda.visible = false;

scene.add(panda);

function createSwitch(x,z,color){

    const switchBox = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
            color,
            emissive:0x111111
        })
    );

    switchBox.position.set(x,1,z);

    scene.add(switchBox);

    return switchBox;
}

const carouselSwitch = createSwitch(-14,-10,0xff4444);
const arcadeSwitch = createSwitch(13,-10,0x4444ff);
const mainBreaker = createSwitch(14,10,0x00ffcc);

const door = new THREE.Mesh(
    new THREE.BoxGeometry(4,4,0.5),
    new THREE.MeshStandardMaterial({
        color:0x333333
    })
);

door.position.set(0,2,5);

scene.add(door);

const keys = {};

document.addEventListener("keydown",(e)=>{

    keys[e.code] = true;

    if(e.code === "KeyF"){

        flashlightOn = !flashlightOn;

        flashlight.intensity = flashlightOn ? 8 : 0;

        document.getElementById("flashlight").innerHTML =
            "FLASHLIGHT : " + (flashlightOn ? "ON" : "OFF");
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.code] = false;
});

let yaw = 0;
let pitch = 0;

let stamina = 100;

const message = document.getElementById("message");

function showMessage(text){

    message.innerHTML = text;
    message.style.opacity = 1;

    setTimeout(()=>{
        message.style.opacity = 0;
    },3000);
}

showMessage("屋上へ到着した");

function distance(a,b){

    return a.position.distanceTo(b.position);
}

let carouselOn = false;
let arcadeOn = false;
let breakerOn = false;
let gameCompleted = false;

function updateObjective(){

    document.getElementById("objective").innerHTML = `
    <b>OBJECTIVE</b><br><br>

    メリーゴーランド : ${carouselOn ? "ON" : "OFF"}<br>
    ゲームコーナー : ${arcadeOn ? "ON" : "OFF"}<br>
    中央ブレーカー : ${breakerOn ? "ON" : "OFF"}<br><br>

    ${gameCompleted ? "管理室へ向かう" : "全ての電源を復旧する"}<br><br>

    WASD : 移動<br>
    SHIFT : ダッシュ<br>
    E : 調べる<br>
    F : ライト ON/OFF
    `;
}

function interact(){

    if(distance(camera,carouselSwitch) < 2 && !carouselOn){

        carouselOn = true;

        carouselSwitch.material.emissive.setHex(0xff0000);

        showMessage("メリーゴーランド電源を起動した");

        pandaFlash();
    }

    if(distance(camera,arcadeSwitch) < 2 && !arcadeOn){

        arcadeOn = true;

        arcadeSwitch.material.emissive.setHex(0x0000ff);

        showMessage("ゲームコーナー電源を起動した");

        pandaFlash();
    }

    if(distance(camera,mainBreaker) < 2 &&
       carouselOn &&
       arcadeOn &&
       !breakerOn){

        breakerOn = true;

        mainBreaker.material.emissive.setHex(0x00ffff);

        moon.intensity = 0.35;

        showMessage("中央電源を復旧した");

        pandaFlash();

        setTimeout(()=>{

            showMessage("管理室の扉が開いた");

            gameCompleted = true;

            door.position.y = -5;

        },3000);
    }

    if(distance(camera,door) < 3 && gameCompleted){

        document.getElementById("fade").style.opacity = 1;

        showMessage("CHAPTER 1 CLEAR");

    }

    updateObjective();
}

document.addEventListener("keydown",(e)=>{

    if(e.code === "KeyE"){
        interact();
    }
});

function pandaFlash(){

    panda.position.set(
        camera.position.x + (Math.random()*8-4),
        0,
        camera.position.z + (Math.random()*8-4)
    );

    panda.lookAt(camera.position);

    panda.visible = true;

    setTimeout(()=>{
        panda.visible = false;
    },180);
}

function checkCollision(position){

    const playerBox = new THREE.Box3(
        new THREE.Vector3(
            position.x - 0.4,
            position.y - 1,
            position.z - 0.4
        ),
        new THREE.Vector3(
            position.x + 0.4,
            position.y + 1,
            position.z + 0.4
        )
    );

    for(const box of colliders){

        if(playerBox.intersectsBox(box)){
            return true;
        }
    }

    return false;
}

const clock = new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    let moveSpeed = 4;

    if(keys["ShiftLeft"] && stamina > 0){

        moveSpeed = 8;

        stamina -= 28 * delta;

    }else{

        stamina += 18 * delta;
    }

    stamina = Math.max(0,Math.min(100,stamina));

    document.getElementById("staminaFill").style.width =
        stamina + "%";

    if(keys["ArrowLeft"]){
        yaw += 1.5 * delta;
    }

    if(keys["ArrowRight"]){
        yaw -= 1.5 * delta;
    }

    if(keys["ArrowUp"]){
        pitch += 1.2 * delta;
    }

    if(keys["ArrowDown"]){
        pitch -= 1.2 * delta;
    }

    pitch = Math.max(-1.2,Math.min(1.2,pitch));

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const forward = new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    const right = new THREE.Vector3(
        -forward.z,
        0,
        forward.x
    );

    const oldPosition = camera.position.clone();

    if(keys["KeyW"]){

        camera.position.addScaledVector(
            forward,
            moveSpeed * delta
        );
    }

    if(keys["KeyS"]){

        camera.position.addScaledVector(
            forward,
            -moveSpeed * delta
        );
    }

    if(keys["KeyA"]){

        camera.position.addScaledVector(
            right,
            -moveSpeed * delta
        );
    }

    if(keys["KeyD"]){

        camera.position.addScaledVector(
            right,
            moveSpeed * delta
        );
    }

    if(checkCollision(camera.position)){
        camera.position.copy(oldPosition);
    }

    flashlight.position.copy(camera.position);

    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    flashlight.target.position.copy(
        camera.position.clone().add(
            direction.multiplyScalar(10)
        )
    );

    if(carouselOn){

        carousel.rotation.y += 0.8 * delta;

    }else{

        carousel.rotation.y += 0.05 * delta;
    }

    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
