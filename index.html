<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOFTOP HORROR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:20px;
    opacity:0.8;
}

#objective{
    position:absolute;
    top:20px;
    left:20px;
    width:430px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.2);
    padding:16px;
    line-height:1.8;
    font-size:14px;
}

#message{
    position:absolute;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.8);
    padding:12px 20px;
    opacity:0;
    transition:0.3s;
    font-size:15px;
}

#stamina{
    position:absolute;
    left:20px;
    bottom:20px;
    width:220px;
    height:12px;
    border:1px solid white;
}

#staminaFill{
    width:100%;
    height:100%;
    background:white;
}

#flashlight{
    position:absolute;
    right:20px;
    bottom:20px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 14px;
    font-size:14px;
}

#powerInfo{
    position:absolute;
    right:20px;
    top:20px;
    width:280px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.2);
    padding:14px;
    line-height:1.8;
    font-size:14px;
}

#cameraOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    z-index:50;
    pointer-events:auto;
}

#cameraFeed{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:70%;
    height:70%;
    border:4px solid white;
    background:black;
    overflow:hidden;
}

#cameraNoise{
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 2px,
            transparent 2px,
            transparent 4px
        );
    animation:noise 0.1s infinite;
}

@keyframes noise{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(4px);
    }
}

#cameraText{
    position:absolute;
    left:20px;
    top:20px;
    color:white;
    font-size:24px;
}

#cameraHint{
    position:absolute;
    left:20px;
    bottom:20px;
    line-height:1.8;
}

#cameraView{
    position:absolute;
    inset:0;
}

.camObject{
    position:absolute;
    background:white;
}

#fade{
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:1s;
}

</style>
</head>

<body>

<div id="ui">

<div id="crosshair">+</div>

<div id="objective">

<b>OBJECTIVE</b><br><br>

監視室を復旧して<br>
カメラから扉を開く。<br><br>

暗闇で動く存在に注意。<br><br>

・監視室へ送電<br>
・監視カメラ起動<br>
・遠隔で扉を開く<br>
・管理室へ向かう<br><br>

WASD : 移動<br>
SHIFT : ダッシュ<br>
E : 調べる<br>
F : ライト ON/OFF<br>
C : カメラ切替<br>
矢印キー : 視点移動

</div>

<div id="powerInfo"></div>

<div id="message"></div>

<div id="stamina">
<div id="staminaFill"></div>
</div>

<div id="flashlight">
FLASHLIGHT : OFF
</div>

<div id="fade"></div>

</div>

<div id="cameraOverlay">

<div id="cameraFeed">

<div id="cameraNoise"></div>

<div id="cameraText">
CAM 1
</div>

<div id="cameraView"></div>

<div id="cameraHint">
Q / E : カメラ切替<br>
SPACE : 扉を開く<br>
ESC : 閉じる
</div>

</div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(
    0x000000,
    8,
    45
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,2,14);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.setClearColor(0x000000);

document.body.appendChild(
    renderer.domElement
);

const ambient =
new THREE.AmbientLight(
    0x404040,
    0.5
);

scene.add(ambient);

const moon =
new THREE.DirectionalLight(
    0xaaccff,
    0.45
);

moon.position.set(10,20,10);

scene.add(moon);

const flashlight =
new THREE.SpotLight(
    0xffffff,
    0
);

flashlight.angle = 0.75;
flashlight.penumbra = 0.7;
flashlight.distance = 55;

scene.add(flashlight);
scene.add(flashlight.target);

let flashlightOn = false;

const floor =
new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({
        color:0x2c2c2c
    })
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

const colliders = [];

function createWall(
    x,y,z,w,h,d,color=0x222222
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color
        })
    );

    mesh.position.set(x,y,z);

    scene.add(mesh);

    colliders.push(
        new THREE.Box3().setFromObject(mesh)
    );

    return mesh;
}

createWall(0,2,-20,40,4,1);
createWall(-20,2,0,1,4,40);
createWall(20,2,0,1,4,40);
createWall(0,2,20,40,4,1);

createWall(0,2.5,12,12,5,1,0x181818);
createWall(-6,2.5,8,1,5,8,0x181818);
createWall(6,2.5,8,1,5,8,0x181818);
createWall(0,5,8,12,1,8,0x181818);

const door =
new THREE.Mesh(
    new THREE.BoxGeometry(3,4,0.3),
    new THREE.MeshStandardMaterial({
        color:0x555555
    })
);

door.position.set(0,2,4);

scene.add(door);

const cameraSwitch =
new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({
        color:0x4444ff,
        emissive:0x111111
    })
);

cameraSwitch.position.set(
    14,
    1,
    -12
);

scene.add(cameraSwitch);

const enemy = new THREE.Group();

const body =
new THREE.Mesh(
    new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

body.position.y = 1.2;

const head =
new THREE.Mesh(
    new THREE.SphereGeometry(0.9,32,32),
    new THREE.MeshStandardMaterial({
        color:0xffffff
    })
);

head.position.y = 3;

const eye1 =
new THREE.Mesh(
    new THREE.SphereGeometry(0.12),
    new THREE.MeshBasicMaterial({
        color:0xff0000
    })
);

eye1.position.set(
    -0.2,
    3,
    0.8
);

const eye2 = eye1.clone();

eye2.position.x = 0.2;

enemy.add(body);
enemy.add(head);
enemy.add(eye1);
enemy.add(eye2);

enemy.position.set(
    0,
    0,
    -15
);

scene.add(enemy);

const keys = {};

document.addEventListener(
    "keydown",
    (e)=>{

        keys[e.code] = true;

        if(e.code === "KeyF"){

            flashlightOn =
            !flashlightOn;

            flashlight.intensity =
            flashlightOn ? 8 : 0;

            document.getElementById(
                "flashlight"
            ).innerHTML =
            "FLASHLIGHT : " +
            (flashlightOn ? "ON" : "OFF");
        }
    }
);

document.addEventListener(
    "keyup",
    (e)=>{
        keys[e.code] = false;
    }
);

let yaw = 0;
let pitch = 0;
let stamina = 100;

const message =
document.getElementById(
    "message"
);

function showMessage(text){

    message.innerHTML = text;

    message.style.opacity = 1;

    setTimeout(()=>{
        message.style.opacity = 0;
    },3000);
}

showMessage(
    "監視システムが停止している"
);

let cameraPower = false;
let gameCompleted = false;

function updatePowerUI(){

    document.getElementById(
        "powerInfo"
    ).innerHTML = `
    <b>CAMERA SYSTEM</b><br><br>

    監視室 :
    ${cameraPower ? "ONLINE" : "OFFLINE"}<br><br>

    扉 :
    ${gameCompleted ? "OPEN" : "LOCKED"}<br><br>

    暗闇では敵が移動する
    `;
}

updatePowerUI();

function distance(a,b){

    return a.position.distanceTo(
        b.position
    );
}

function interact(){

    if(
        distance(camera,cameraSwitch) < 2
    ){

        cameraPower = true;

        cameraSwitch.material.emissive
        .setHex(0x0000ff);

        showMessage(
            "監視システムが起動した"
        );

        updatePowerUI();
    }

    if(
        distance(camera,door) < 4 &&
        gameCompleted
    ){

        document.getElementById(
            "fade"
        ).style.opacity = 1;

        showMessage(
            "CHAPTER 1 CLEAR"
        );
    }
}

document.addEventListener(
    "keydown",
    (e)=>{

        if(e.code === "KeyE"){
            interact();
        }
    }
);

function checkCollision(position){

    const playerBox =
    new THREE.Box3(
        new THREE.Vector3(
            position.x - 0.4,
            position.y - 1,
            position.z - 0.4
        ),
        new THREE.Vector3(
            position.x + 0.4,
            position.y + 1,
            position.z + 0.4
        )
    );

    for(const box of colliders){

        if(
            playerBox.intersectsBox(box)
        ){
            return true;
        }
    }

    return false;
}

let cameraOpened = false;
let currentCam = 1;

const overlay =
document.getElementById(
    "cameraOverlay"
);

const cameraText =
document.getElementById(
    "cameraText"
);

const cameraView =
document.getElementById(
    "cameraView"
);

function renderCameraView(){

    cameraText.innerHTML =
    "CAM " + currentCam;

    if(currentCam === 1){

        cameraView.innerHTML = `
        <div class="camObject"
        style="
        width:80px;
        height:180px;
        left:60%;
        top:35%;
        background:white;
        ">
        </div>
        `;
    }

    if(currentCam === 2){

        cameraView.innerHTML = `
        <div class="camObject"
        style="
        width:120px;
        height:120px;
        left:30%;
        top:45%;
        background:red;
        border-radius:50%;
        ">
        </div>
        `;
    }

    if(currentCam === 3){

        cameraView.innerHTML = `
        <div style="
        position:absolute;
        left:50%;
        top:50%;
        transform:
        translate(-50%,-50%);
        color:white;
        font-size:28px;
        ">
        LOCKED DOOR
        </div>
        `;
    }
}

document.addEventListener(
    "keydown",
    (e)=>{

        if(
            e.code === "KeyC" &&
            cameraPower
        ){

            cameraOpened =
            !cameraOpened;

            overlay.style.display =
            cameraOpened ? "block" : "none";

            renderCameraView();
        }

        if(cameraOpened){

            if(e.code === "KeyQ"){

                currentCam--;

                if(currentCam < 1){
                    currentCam = 3;
                }

                renderCameraView();
            }

            if(e.code === "KeyE"){

                currentCam++;

                if(currentCam > 3){
                    currentCam = 1;
                }

                renderCameraView();
            }

            if(
                e.code === "Space" &&
                currentCam === 3
            ){

                gameCompleted = true;

                door.position.y = -5;

                showMessage(
                    "管理室の扉を解放した"
                );

                updatePowerUI();
            }

            if(e.code === "Escape"){

                cameraOpened = false;

                overlay.style.display =
                "none";
            }
        }
    }
);

function updateEnemy(delta){

    const direction =
    new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    const enemyDirection =
    enemy.position.clone()
    .sub(camera.position)
    .normalize();

    const flashlightDot =
    direction.dot(
        enemyDirection
    );

    const enemyDistance =
    enemy.position.distanceTo(
        camera.position
    );

    const flashlightHits =
    flashlightOn &&
    flashlightDot > 0.92 &&
    enemyDistance < 15;

    if(!flashlightHits){

        const moveDir =
        camera.position.clone()
        .sub(enemy.position)
        .normalize();

        enemy.position.add(
            moveDir.multiplyScalar(
                delta * 1.7
            )
        );
    }

    enemy.lookAt(camera.position);

    if(enemyDistance < 1.5){

        document.getElementById(
            "fade"
        ).style.opacity = 1;

        showMessage(
            "GAME OVER"
        );
    }
}

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
    clock.getDelta();

    let moveSpeed = 4;

    if(
        keys["ShiftLeft"] &&
        stamina > 0
    ){

        moveSpeed = 8;

        stamina -= 28 * delta;

    }else{

        stamina += 18 * delta;
    }

    stamina = Math.max(
        0,
        Math.min(100,stamina)
    );

    document.getElementById(
        "staminaFill"
    ).style.width =
    stamina + "%";

    if(keys["ArrowLeft"]){
        yaw += 1.5 * delta;
    }

    if(keys["ArrowRight"]){
        yaw -= 1.5 * delta;
    }

    if(keys["ArrowUp"]){
        pitch += 1.2 * delta;
    }

    if(keys["ArrowDown"]){
        pitch -= 1.2 * delta;
    }

    pitch = Math.max(
        -1.2,
        Math.min(1.2,pitch)
    );

    camera.rotation.order =
    "YXZ";

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const forward =
    new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    const right =
    new THREE.Vector3(
        -forward.z,
        0,
        forward.x
    );

    const oldPosition =
    camera.position.clone();

    if(keys["KeyW"]){

        camera.position.addScaledVector(
            forward,
            moveSpeed * delta
        );
    }

    if(keys["KeyS"]){

        camera.position.addScaledVector(
            forward,
            -moveSpeed * delta
        );
    }

    if(keys["KeyA"]){

        camera.position.addScaledVector(
            right,
            -moveSpeed * delta
        );
    }

    if(keys["KeyD"]){

        camera.position.addScaledVector(
            right,
            moveSpeed * delta
        );
    }

    if(
        checkCollision(
            camera.position
        )
    ){

        camera.position.copy(
            oldPosition
        );
    }

    flashlight.position.copy(
        camera.position
    );

    const direction =
    new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    flashlight.target.position.copy(
        camera.position.clone().add(
            direction.multiplyScalar(10)
        )
    );

    updateEnemy(delta);

    renderer.render(
        scene,
        camera
    );
}

animate();

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
