<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Survival Horror Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #f00; font-family: 'Courier New', Courier, monospace;
            text-shadow: 2px 2px 2px #000; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>RECYCLE PANIC: Prototype</h1>
        <p>BATTERY: <span id="battery">100</span>%</p>
        <p>[WASD] Move | [Mouse] Look</p>
    </div>

    <!-- Three.jsのCDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- シーン設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 1, 15); // 霧で奥を見えなくする

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライティング (懐中電灯) ---
        const flashlight = new THREE.SpotLight(0xffffff, 5);
        flashlight.angle = Math.PI / 6;
        flashlight.penumbra = 0.3;
        flashlight.castShadow = true;
        flashlight.distance = 20;
        camera.add(flashlight);
        flashlight.position.set(0, 0, 1);
        flashlight.target = new THREE.Object3D();
        camera.add(flashlight.target);
        flashlight.target.position.set(0, 0, -1);
        scene.add(camera);

        const ambient = new THREE.AmbientLight(0x111111); // 微かな環境光
        scene.add(ambient);

        // --- 地面と壁 (廃墟風) ---
        const textureLoader = new THREE.TextureLoader();
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        
        // 地面
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x222222 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 障害物（ジャンク山）
        for(let i=0; i<50; i++) {
            const wall = new THREE.Mesh(
                geometry,
                new THREE.MeshStandardMaterial({ color: Math.random() * 0x555555 })
            );
            wall.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }

        // --- 敵 (不気味な赤い立方体) ---
        const enemy = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        enemy.position.set(0, 0.9, -10);
        scene.add(enemy);

        // --- 操作系 ---
        let move = { fwd: false, bwd: false, lft: false, rgt: false };
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') move.fwd = true;
            if(e.code === 'KeyS') move.bwd = true;
            if(e.code === 'KeyA') move.lft = true;
            if(e.code === 'KeyD') move.rgt = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') move.fwd = false;
            if(e.code === 'KeyS') move.bwd = false;
            if(e.code === 'KeyA') move.lft = false;
            if(e.code === 'KeyD') move.rgt = false;
        });

        // マウスによる視点移動（クリックでロック）
        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
            }
        });

        camera.position.y = 1.6; // 目線の高さ

        // --- 更新ループ ---
        let battery = 100;
        function animate() {
            requestAnimationFrame(animate);

            // 移動処理
            const speed = 0.1;
            if(move.fwd) camera.translateZ(-speed);
            if(move.bwd) camera.translateZ(speed);
            if(move.lft) camera.translateX(-speed);
            if(move.rgt) camera.translateX(speed);
            camera.position.y = 1.6; // 高さを固定

            // バッテリー消費
            if(battery > 0) {
                battery -= 0.01;
                document.getElementById('battery').innerText = Math.floor(battery);
                flashlight.intensity = (battery / 100) * 5;
            }

            // 敵の単純な追跡（恐怖演出）
            const dist = camera.position.distanceTo(enemy.position);
            if(dist < 15) {
                enemy.lookAt(camera.position.x, 0.9, camera.position.z);
                enemy.translateZ(0.02);
            }

            renderer.render(scene, camera);
        }
        animate();

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
