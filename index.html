<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mascot Horror - Close-up Kill</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', monospace; }
        #viewport { position: fixed; width: 100%; height: 100%; box-shadow: inset 0 0 180px #000; pointer-events: none; z-index: 5; }
        #fade-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #200; /* 襲われた時の赤黒い暗転 */
            opacity: 0; pointer-events: none; z-index: 100;
            transition: opacity 1s ease-in;
        }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; border-left: 3px solid #f00; padding-left: 10px; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="fade-overlay"></div>
    <div id="ui">
        <div>STATUS: <span id="status">探索中</span></div>
        <div style="font-size: 0.8em; color: #888;">赤いトリガーに触れると演出開始</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.Fog(0x050508, 1, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const flashlight = new THREE.SpotLight(0xffffff, 250, 50, Math.PI/6, 0.4);
        camera.add(flashlight);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- 敵 (Mascot) ---
        const enemy = new THREE.Group();
        // より「顔」を強調したデザイン
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshStandardMaterial({color: 0x440000}));
        const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.1), new THREE.MeshStandardMaterial({color: 0x000000}));
        mouth.position.set(0, -0.4, 0.4);
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff0000, emissiveIntensity: 5}));
        eye.position.set(0.3, 0.3, 0.4);
        const eye2 = eye.clone(); eye2.position.x = -0.3;
        enemy.add(head, mouth, eye, eye2);
        enemy.position.set(0, 1.4, -5); 
        scene.add(enemy);

        // --- 地面とトリガー ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        const trigger = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0xff0000}));
        trigger.position.set(0, 0.1, 0);
        scene.add(trigger);

        // --- 状態管理 ---
        let isDead = false;
        let deathTimer = 0;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            if (!isDead) {
                // 通常移動
                const speed = 0.15;
                if(keys['KeyW']) camera.translateZ(-speed);
                if(keys['KeyS']) camera.translateZ(speed);
                if(keys['KeyA']) camera.translateX(-speed);
                if(keys['KeyD']) camera.translateX(speed);
                if(keys['ArrowLeft'] || keys['KeyJ']) camera.rotation.y += 0.04;
                if(keys['ArrowRight'] || keys['KeyL']) camera.rotation.y -= 0.04;

                // トリガー接触
                if (camera.position.distanceTo(trigger.position) < 1.2) {
                    isDead = true;
                    document.getElementById('status').innerText = "捕まった！";
                    document.getElementById('status').style.color = "#f00";
                }
            } else {
                // --- ジャンプスケア演出 ---
                deathTimer += 0.016;

                // 1. カメラを敵の目に固定
                const eyePos = new THREE.Vector3().copy(enemy.position);
                eyePos.y += 0.3; // 目の高さに合わせる
                camera.lookAt(eyePos);

                // 2. 敵が至近距離まで突進
                // 距離0.75まで近づく（これ以上近いとモデルの中に入ってしまうため）
                const dist = enemy.position.distanceTo(camera.position);
                if (dist > 0.75) {
                    const moveDir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
                    enemy.position.add(moveDir.multiplyScalar(0.45)); // 素早く接近
                }

                // 3. 接触後の揺れと暗転
                if (deathTimer > 0.4) {
                    // カメラをランダムに激しく揺らす
                    camera.position.x += (Math.random() - 0.5) * 0.25;
                    camera.position.y += (Math.random() - 0.5) * 0.25;
                    
                    // 徐々に画面を赤黒く染める
                    document.getElementById('fade-overlay').style.opacity = 1;
                }

                // 終了処理
                if (deathTimer > 2.0) location.reload();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
